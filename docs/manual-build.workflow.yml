name: Build Windows Installer (manual verification)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build bundles
        run: npm run ci

      - name: Verify Windows shutdown guard
        run: node scripts/verify-shutdown-guard.cjs

      - name: Build Windows installer (test-sign mode)
        run: npx electron-builder --win nsis --publish never --config.forceCodeSigning=false --config.win.signAndEditExecutable=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron-pack-output/*.exe


