                    {showCategoryModal && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 bg-black/50 text-slate-800">
                            <div className="bg-white rounded-xl shadow-xl max-w-md w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200">
                                <div className="px-4 py-3 border-b flex items-center justify-between bg-slate-50 shrink-0">
                                    <h3 className="text-sm font-bold">{t('categoryManageTitle')}</h3>
                                    <button type="button" onClick={() => setShowCategoryModal(false)} className="text-slate-400 hover:text-slate-600 p-1">
                                        <SVG.XCircle c="w-5 h-5" />
                                    </button>
                                </div>
                                <p className="px-4 py-2 text-[11px] text-slate-500 border-b border-slate-100">{t('categoryManageHint')}</p>
                                <div className="px-4 py-3 overflow-y-auto flex-1 min-h-0 space-y-2 custom-scrollbar">
                                    {data.categories.length === 0 ? (
                                        <div className="text-center text-[12px] text-slate-400 py-6">{t('categoryManageEmpty')}</div>
                                    ) : (
                                        data.categories.map((cat) => {
                                            const count = data.records.filter((r) => r.categoryId === cat.id).length;
                                            return (
                                                <div key={cat.id} className="flex items-center gap-2 p-2 rounded-lg border border-slate-200 bg-slate-50/80">
                                                    <input
                                                        type="text"
                                                        className="flex-1 min-w-0 border border-slate-200 rounded-md px-2 py-1.5 text-[12px] font-bold outline-none focus:border-blue-400 bg-white"
                                                        value={cat.name}
                                                        onChange={(e) => {
                                                            const v = e.target.value;
                                                            setData((prev) => ({
                                                                ...prev,
                                                                categories: prev.categories.map((c) => (c.id === cat.id ? { ...c, name: v } : c)),
                                                            }));
                                                        }}
                                                        onBlur={(e) => {
                                                            const v = e.target.value.trim();
                                                            setData((prev) => ({
                                                                ...prev,
                                                                categories: prev.categories.map((c) =>
                                                                    c.id === cat.id ? { ...c, name: v || t('categoryDefaultName') } : c,
                                                                ),
                                                            }));
                                                        }}
                                                    />
                                                    <span className="text-[10px] text-slate-500 shrink-0 tabular-nums min-w-[2rem] text-center" title={t('items')}>
                                                        {count}
                                                    </span>
                                                    <button
                                                        type="button"
                                                        onClick={() => handleDeleteCategory(cat.id, null)}
                                                        className="shrink-0 p-1.5 rounded-md text-red-500 hover:bg-red-50"
                                                        title={t('deleteRecord')}
                                                    >
                                                        <SVG.Trash2 c="w-4 h-4" />
                                                    </button>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                                <div className="px-4 py-3 border-t bg-slate-50 space-y-3 shrink-0">
                                    <div className="text-[11px] font-bold text-slate-700">{t('addCategory')}</div>
                                    <div className="flex gap-2 flex-wrap sm:flex-nowrap">
                                        <input
                                            type="text"
                                            value={newCategoryName}
                                            onChange={(e) => setNewCategoryName(e.target.value)}
                                            className="flex-1 min-w-[8rem] border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-blue-400 text-[13px] bg-white"
                                            placeholder={t('categoryPlaceholder')}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') {
                                                    e.preventDefault();
                                                    handleAddCategory();
                                                }
                                            }}
                                        />
                                        <button type="button" onClick={handleAddCategory} className="shrink-0 theme-primary-btn px-4 py-2 rounded-lg text-[12px] font-bold">
                                            {t('confirmCreate')}
                                        </button>
                                    </div>
                                    <button type="button" onClick={() => setShowCategoryModal(false)} className="w-full py-2 rounded-lg border border-slate-200 text-[12px] font-medium text-slate-600 hover:bg-slate-100">
                                        {t('cancel')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {detailOpen.show && (
                        <div className="fixed inset-0 z-[220] flex items-center justify-center p-3 bg-black/50 text-slate-800">
                            <div className="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[86vh] flex flex-col overflow-hidden">
                                <div className="px-4 py-3 border-b flex items-center justify-between bg-slate-50 shrink-0">
                                    <h3 className="text-sm font-bold truncate">{detailOpen.title}</h3>
                                    <button type="button" onClick={() => setDetailOpen({ show: false, title: '', content: '' })} className="text-slate-400 hover:text-slate-600">
                                        <SVG.XCircle c="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto text-[13px] leading-relaxed whitespace-pre-wrap break-words">
                                    {detailOpen.content || '-'}
                                </div>
                                <div className="px-4 py-3 border-t bg-slate-50 shrink-0">
                                    <button type="button" onClick={() => setDetailOpen({ show: false, title: '', content: '' })} className="w-full py-2 rounded-lg theme-primary-btn text-[12px] font-bold">
                                        {t('iKnow')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {alertOpen.show && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-3 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 text-center">
                                <h3 className="text-sm font-bold mb-2">{t('sysPrompt')}</h3>
                                <p className="text-slate-600 text-[12px] mb-4">{alertOpen.message}</p>
                                <button type="button" onClick={() => setAlertOpen({ show: false, message: '' })} className="w-full py-2 rounded-lg theme-primary-btn text-[12px] font-bold">
                                    {t('iKnow')}
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmOpen.show && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-3 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 text-center">
                                <h3 className="text-sm font-bold mb-2">{t('confirmAction')}</h3>
                                <p className="text-slate-600 text-[12px] mb-4">{confirmOpen.message}</p>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setConfirmOpen({ show: false, message: '', onOk: null })} className="flex-1 py-2 rounded-lg border text-[12px] font-medium">
                                        {t('cancel')}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            confirmOpen.onOk && confirmOpen.onOk();
                                            setConfirmOpen({ show: false, message: '', onOk: null });
                                        }}
                                        className="flex-1 py-2 rounded-lg bg-red-600 text-white text-[12px] font-bold"
                                    >
                                        {t('confirmBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /** 右侧独立话术库；弹窗编辑、拖拽排序、双击发送。 */
        const RightScriptLibrary = ({ libraryId, onFill, onSend }) => {
            const { t, lang } = useContext(LanguageContext);
            const [isManageCollapsed, setIsManageCollapsed] = useState(false);
            const [scripts, setScripts] = useState(() => readScriptQuick(libraryId));
            const [modal, setModal] = useState(null);
            const [saveError, setSaveError] = useState('');
            const [pendingDeleteId, setPendingDeleteId] = useState(null);
            const [selectedScriptId, setSelectedScriptId] = useState('');
            const [draggedQuickIdx, setDraggedQuickIdx] = useState(null);
            const [dragOverQuickIdx, setDragOverQuickIdx] = useState(null);
            const sendGuardRef = useRef({ ts: 0, key: '', busy: false });
            const copyGuardRef = useRef({ ts: 0, key: '' });
            const QUICK_SCRIPT_SEND_GUARD_MS = 180;

            const persist = (next) => {
                if (!writeScriptQuick(libraryId, next)) {
                    setSaveError(t('scriptLibraryStorageError'));
                    return false;
                }
                setScripts(next);
                setSaveError('');
                return true;
            };

            const openAdd = () => {
                setSaveError('');
                setModal({ id: null, title: '', content: '' });
            };
            const openEdit = (s) => {
                setSaveError('');
                setModal({ id: s.id, title: s.title || '', content: s.content || '' });
            };
            const selectedScript = useMemo(
                () => scripts.find((x) => x.id === selectedScriptId) || null,
                [scripts, selectedScriptId],
            );
            const saveModal = () => {
                if (!modal) return;
                const content = String(modal.content || '').trim();
                if (!content) {
                    setSaveError(t('quickScriptContentRequired'));
                    return;
                }
                const title = String(modal.title || '').trim() || t('scriptUntitled');
                if (modal.id) {
                    if (!persist(scripts.map((s) => (s.id === modal.id ? { ...s, title, content } : s)))) return;
                } else {
                    if (!persist([{ id: generateId(), title, content }, ...scripts])) return;
                }
                setModal(null);
            };

            const handleImport = (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const raw = JSON.parse(String(reader.result || '[]'));
                        if (!Array.isArray(raw)) return;
                        const next = raw.map((row, i) => ({
                            id: row.id || generateId(),
                            title: row.title || `导入${i + 1}`,
                            content: row.content || '',
                        })).filter((row) => row.content);
                        const map = new Map(scripts.map((s) => [s.id, s]));
                        next.forEach((s) => map.set(s.id, s));
                        persist(Array.from(map.values()));
                    } catch (_) {}
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const handleExport = () => {
                const blob = new Blob([JSON.stringify(scripts, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `fastgc_script_quick_${libraryId}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            };

            const handleQuickCopy = (e, content, scriptId = '') => {
                e.preventDefault();
                e.stopPropagation();
                const text = String(content || '').trim();
                if (!text) return;
                const now = Date.now();
                const key = `${String(scriptId || '').trim()}::${text}`;
                const guard = copyGuardRef.current || { ts: 0, key: '' };
                if (guard.key === key && now - Number(guard.ts || 0) < 900) return;
                copyGuardRef.current = { ts: now, key };
                onFill(text);
            };
            const handleRowDoubleClick = async (e, content, scriptId = '') => {
                e.preventDefault();
                e.stopPropagation();
                const text = String(content || '').trim();
                if (!text) return;
                const now = Date.now();
                const key = `${String(scriptId || '').trim()}::${text}`;
                const guard = sendGuardRef.current || { ts: 0, key: '', busy: false };
                // 防止双击事件链或宿主重复触发导致同一条话术短时间内发送两次。
                if (guard.busy) return;
                if (guard.key === key && now - Number(guard.ts || 0) < QUICK_SCRIPT_SEND_GUARD_MS) return;
                sendGuardRef.current = { ts: now, key, busy: true };
                try {
                    await Promise.resolve(onSend(text, { source: 'right-script' }));
                } finally {
                    const latest = sendGuardRef.current || { ts: now, key, busy: true };
                    sendGuardRef.current = { ...latest, busy: false, ts: Date.now(), key };
                }
            };

            const handleQuickDragStart = (e, index) => {
                setDraggedQuickIdx(index);
                try {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', String(index));
                    fastgcSetMinimalDragImage(e.dataTransfer);
                } catch (_) {}
            };
            const handleQuickDragOver = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOverQuickIdx(index);
            };
            const handleQuickDrop = (e, dropIndex) => {
                e.preventDefault();
                e.stopPropagation();
                const from = draggedQuickIdx;
                setDraggedQuickIdx(null);
                setDragOverQuickIdx(null);
                if (from === null || from === dropIndex) return;
                const next = [...scripts];
                const [moved] = next.splice(from, 1);
                const insertAt = from < dropIndex ? dropIndex - 1 : dropIndex;
                next.splice(insertAt, 0, moved);
                persist(next);
            };
            const handleQuickDragEnd = () => {
                setDraggedQuickIdx(null);
                setDragOverQuickIdx(null);
            };
            useEffect(() => {
                if (!scripts.length) {
                    setSelectedScriptId('');
                    return;
                }
                if (!selectedScriptId || !scripts.some((x) => x.id === selectedScriptId)) {
                    setSelectedScriptId(scripts[0].id);
                }
            }, [scripts, selectedScriptId]);

            return (
                <div role="tabpanel" id={`script-library-${libraryId}`} aria-labelledby={`script-library-tab-${libraryId}`} data-script-library={libraryId} className="flex-1 flex flex-col min-h-0 overflow-hidden no-scrollbar bg-[#f8f9fa] animate-[fadeIn_0.2s]">
                    <div className="p-3 bg-white border-b shadow-sm shrink-0">
                        <div className="flex justify-between items-center cursor-pointer px-1" onClick={() => setIsManageCollapsed(!isManageCollapsed)}>
                            <div className="text-[12px] text-slate-500 font-extrabold flex items-center gap-2"><SVG.Settings c="w-3.5 h-3.5" /> {t('quickManageLabel')}</div>
                            <SVG.ChevronDown c={`w-4 h-4 text-slate-300 transition-transform ${isManageCollapsed ? '-rotate-90' : ''}`} />
                        </div>
                        {!isManageCollapsed && (
                            <div className="mt-3 space-y-2 animate-[fadeIn_0.15s]">
                                <div className="flex gap-2">
                                    <button type="button" onClick={(e) => { e.stopPropagation(); openAdd(); }} className="flex-1 py-1.5 theme-primary-btn rounded-xl text-[11px] font-bold shadow-sm">{t('addBtn')}</button>
                                    <button
                                        type="button"
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            if (selectedScript) openEdit(selectedScript);
                                        }}
                                        disabled={!selectedScript}
                                        className={`flex-1 py-1.5 rounded-xl text-[11px] font-bold border ${
                                            selectedScript
                                                ? 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                                                : 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'
                                        }`}
                                    >
                                        {t('quickScriptEdit')}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            if (selectedScript) setPendingDeleteId(selectedScript.id);
                                        }}
                                        disabled={!selectedScript}
                                        className={`flex-1 py-1.5 rounded-xl text-[11px] font-bold border ${
                                            selectedScript
                                                ? 'bg-red-50 border-red-200 text-red-600 hover:bg-red-100'
                                                : 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed'
                                        }`}
                                    >
                                        {t('deleteRecord')}
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    <label className="flex-1 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-bold text-center cursor-pointer">
                                        {t('importBtn')}<input type="file" accept=".json,application/json" onChange={handleImport} className="hidden" />
                                    </label>
                                    <button type="button" onClick={(e) => { e.stopPropagation(); handleExport(); }} className="flex-1 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-bold">{t('exportBtn')}</button>
                                </div>
                                <div className="text-[10px] text-slate-400 px-0.5">{t('quickScriptOrderHint')}</div>
                            </div>
                        )}
                    </div>
                    {saveError && !modal ? <div role="alert" className="text-[12px] text-red-600 px-3 py-2">{saveError}</div> : null}
                    <div className="flex-1 min-h-0 overflow-y-auto p-2 space-y-1 no-scrollbar pb-10">
                        {scripts.length === 0 ? (
                            <div className="text-[12px] text-slate-400 text-center py-6">{t('quickScriptEmptyList')}</div>
                        ) : (
                            <>
                                <div
                                    className="h-2 shrink-0 rounded-sm bg-transparent"
                                    aria-hidden
                                    onDragOver={(e) => handleQuickDragOver(e, 0)}
                                    onDrop={(e) => handleQuickDrop(e, 0)}
                                />
                                {scripts.map((s, i) => (
                                <div
                                    key={s.id}
                                    onDragOver={(e) => handleQuickDragOver(e, i)}
                                    onDrop={(e) => handleQuickDrop(e, i)}
                                    className={`bg-white px-2 py-1 rounded-lg border flex items-center gap-2 transition-all ${
                                        selectedScriptId === s.id
                                            ? 'border-blue-400 ring-1 ring-blue-200'
                                            : dragOverQuickIdx === i
                                              ? 'border-blue-500 ring-1 ring-blue-300'
                                              : 'border-slate-200 hover:border-blue-300 hover:shadow-sm'
                                    }`}
                                >
                                    <span
                                        draggable
                                        onDragStart={(e) => handleQuickDragStart(e, i)}
                                        onDragEnd={handleQuickDragEnd}
                                        onClick={(e) => e.stopPropagation()}
                                        className="cursor-grab active:cursor-grabbing text-slate-400 hover:text-slate-600 shrink-0 p-0.5 select-none touch-none"
                                        title={t('quickScriptOrderHint')}
                                    >
                                        <SVG.GripVertical c="w-4 h-4" />
                                    </span>
                                    <button
                                        type="button"
                                        className="min-w-0 flex-1 text-left cursor-pointer flex items-start gap-2"
                                        onClick={() => {
                                            setSelectedScriptId(s.id);
                                        }}
                                        onDoubleClick={(e) => handleRowDoubleClick(e, s.content, s.id)}
                                    >
                                        <div className="w-6 h-6 rounded-md bg-slate-50 flex items-center justify-center text-[10px] font-extrabold text-slate-400 shrink-0 mt-0.5">{i + 1}</div>
                                        <div className="min-w-0 flex-1">
                                            <div className="font-bold text-[13px] text-slate-700 truncate">{s.title}</div>
                                            <div
                                                className="text-[12px] text-slate-500 leading-4 truncate"
                                                title={String(s.content || '').trim() || ''}
                                            >
                                                {String(s.content || '').trim() || '-'}
                                            </div>
                                        </div>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={(e) => handleQuickCopy(e, s.content, s.id)}
                                        onDoubleClick={(e) => {
                                            e.preventDefault();
                                            e.stopPropagation();
                                        }}
                                        className="p-1 rounded-md text-slate-400 hover:text-blue-600 hover:bg-blue-50 shrink-0"
                                        title="copy"
                                        aria-label="copy"
                                    >
                                        <SVG.Copy c="w-3.5 h-3.5" />
                                    </button>
                                </div>
                                ))}
                                <div
                                    data-script-drop-end
                                    className="h-5 shrink-0 rounded-sm border border-dashed border-slate-200"
                                    aria-label={lang === 'zh' ? '拖到末尾' : 'Move to end'}
                                    onDragOver={(e) => handleQuickDragOver(e, scripts.length)}
                                    onDrop={(e) => handleQuickDrop(e, scripts.length)}
                                />
                            </>
                        )}
                    </div>
                    {modal && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-3 bg-black/45" onMouseDown={() => setModal(null)}>
                            <div className="bg-white rounded-xl shadow-xl max-w-lg w-full flex flex-col max-h-[90vh] overflow-hidden border border-slate-200" onMouseDown={(e) => e.stopPropagation()}>
                                <div className="px-4 py-3 border-b flex justify-between items-center bg-slate-50 shrink-0">
                                    <h3 className="text-sm font-bold text-slate-800">{t(libraryId === 'zh' ? 'scriptLibraryZh' : 'scriptLibraryEn')} · {modal.id ? t('quickScriptEdit') : t('quickScriptAdd')}</h3>
                                    <button type="button" className="text-slate-400 hover:text-slate-600" onClick={() => setModal(null)} aria-label={t('cancel')}>
                                        <SVG.XCircle c="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-3 text-slate-800">
                                    {saveError ? <div className="text-[12px] text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2">{saveError}</div> : null}
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 mb-1">{t('quickScriptTitlePh')}</label>
                                        <input
                                            type="text"
                                            className="w-full border border-slate-200 rounded-lg px-3 py-2 text-[13px] outline-none focus:border-blue-400"
                                            value={modal.title}
                                            onChange={(e) => { setSaveError(''); setModal((m) => ({ ...m, title: e.target.value })); }}
                                            placeholder={t('quickScriptTitlePh')}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-bold text-slate-500 mb-1">{t('quickScriptBodyPh')}</label>
                                        <textarea
                                            className="w-full border border-slate-200 rounded-lg px-3 py-2 text-[13px] min-h-[140px] resize-y outline-none focus:border-blue-400"
                                            value={modal.content}
                                            onChange={(e) => { setSaveError(''); setModal((m) => ({ ...m, content: e.target.value })); }}
                                            placeholder={t('quickScriptBodyPh')}
                                        />
                                    </div>
                                </div>
                                <div className="px-4 py-3 border-t bg-slate-50 flex justify-end gap-2 shrink-0">
                                    <button type="button" onClick={() => setModal(null)} className="px-4 py-2 rounded-lg border text-[12px] font-medium">{t('cancel')}</button>
                                    <button type="button" onClick={saveModal} className="px-4 py-2 rounded-lg theme-primary-btn text-[12px] font-bold">{t('saveContent')}</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {pendingDeleteId && (
                        <div className="fixed inset-0 z-[205] flex items-center justify-center p-3 bg-black/45" onMouseDown={() => setPendingDeleteId(null)}>
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 border border-slate-200" onMouseDown={(e) => e.stopPropagation()}>
                                <p className="text-[13px] text-slate-700 leading-relaxed">{t('quickScriptDeleteConfirm')}</p>
                                <div className="flex justify-end gap-2 mt-4">
                                    <button type="button" className="px-3 py-1.5 rounded-lg border text-[12px] font-medium" onClick={() => setPendingDeleteId(null)}>{t('cancel')}</button>
                                    <button
                                        type="button"
                                        className="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-[12px] font-bold"
                                        onClick={() => {
                                            if (!persist(scripts.filter((x) => x.id !== pendingDeleteId))) return;
                                            setPendingDeleteId(null);
                                        }}
                                    >
                                        {t('confirmBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function PhoneImportModal({ onClose, onImport }) {
            const { t } = useContext(LanguageContext);
            const [inputText, setInputText] = useState('');
            const [prefix, setPrefix] = useState('+234');
            const [replaceZero, setReplaceZero] = useState(true);
            const handleProcess = () => {
                const lines = inputText.split(/[\n,;\s]+/);
                const processed = [];
                const prefixDigits = String(prefix || '').replace(/[^\d]/g, '');
                const normalizedPrefix = prefixDigits ? `+${prefixDigits}` : String(prefix || '').trim();
                for (let i = 0; i < lines.length; i++) {
                    let cleanStr = String(lines[i]).replace(/[^\d+]/g, '');
                    if (!cleanStr) continue;
                    const digitsOnly = cleanStr.replace(/[^\d]/g, '');
                    if (replaceZero && cleanStr.startsWith('0')) {
                        cleanStr = normalizedPrefix + cleanStr.substring(1);
                    } else if (cleanStr.startsWith('+')) {
                        // Already has an explicit country code.
                    } else if (prefixDigits && digitsOnly.startsWith(prefixDigits)) {
                        // User pasted a full international number without "+", e.g. 234...; do not duplicate 234.
                        cleanStr = digitsOnly;
                    } else {
                        cleanStr = normalizedPrefix + cleanStr;
                    }
                    processed.push({ id: generateId(), phone: cleanStr, normalized: cleanStr.replace(/[^\d]/g, ''), claimed: false, added: false, addTime: Date.now() });
                }
                onImport(processed);
            };
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 bg-black/50">
                    <div className="bg-white rounded-xl shadow-xl max-w-lg w-full flex flex-col max-h-[90vh] overflow-hidden text-slate-800">
                        <div className="px-4 py-3 border-b flex justify-between items-center bg-slate-50 shrink-0">
                            <h3 className="text-sm font-bold">{t('importTitle')}</h3>
                            <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <SVG.XCircle c="w-5 h-5" />
                            </button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1 text-[12px] space-y-3">
                            <div className="bg-blue-50 p-3 rounded-lg border border-blue-100 flex flex-col gap-3">
                                <div className="flex items-center gap-2 flex-wrap">
                                    <label className="font-bold text-blue-900">{t('countryCode')}</label>
                                    <input type="text" value={prefix} onChange={(e) => setPrefix(e.target.value)} className="border border-blue-200 rounded-lg px-2 py-1 w-24 text-center font-mono outline-none" />
                                </div>
                                <label className="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" checked={replaceZero} onChange={(e) => setReplaceZero(e.target.checked)} className="w-4 h-4" />
                                    <span className="font-medium text-blue-900">{t('autoReplaceZero')}</span>
                                </label>
                            </div>
                            <div className="font-medium text-slate-700">{t('pastePhones')}</div>
                            <textarea className="w-full h-40 border rounded-lg p-2 outline-none font-mono text-[11px] resize-none focus:border-blue-400" value={inputText} onChange={(e) => setInputText(e.target.value)} />
                        </div>
                        <div className="px-4 py-3 border-t bg-slate-50 flex justify-end gap-2 shrink-0">
                            <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg border text-[12px] font-medium">
                                {t('cancel')}
                            </button>
                            <button type="button" onClick={handleProcess} className="px-4 py-2 rounded-lg theme-primary-btn text-[12px] font-medium">
                                {t('confirmImport')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        /** 左侧「号码奖励管理」：与工具箱 PhoneManager 一致（localStorage: reward_phone_system_data），与话术库/会话列表无关 */
        function PhoneRewardsDrawer({ onClose, prefillPhone }) {
            const { t } = useContext(LanguageContext);
            const [phones, setPhones] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [exportStatus, setExportStatus] = useState('all');
            const [currentPage, setCurrentPage] = useState(1);
            const [selectedIds, setSelectedIds] = useState(() => new Set());
            const [showImportModal, setShowImportModal] = useState(false);
            const [alertOpen, setAlertOpen] = useState({ show: false, message: '' });
            const [confirmOpen, setConfirmOpen] = useState({ show: false, message: '', onOk: null });
            const ITEMS_PER_PAGE = 40;

            useEffect(() => {
                try {
                    const raw = readStorageTextWithSqliteFirst(PHONE_REWARDS_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    setPhones((Array.isArray(parsed) ? parsed : []).map((p) => ({ ...p, added: Boolean(p?.added) })));
                }
                } catch (_) {}
            }, []);

            /** 打开抽屉时用右侧/当前会话联系人号码预填搜索（与 + 显示无关，匹配时只看数字） */
            useEffect(() => {
                const raw = String(prefillPhone || '').trim();
                if (!raw) return;
                const sanitized = raw.replace(/[^\d+]/g, '');
                if (sanitized) {
                    setSearchQuery(sanitized);
                    setCurrentPage(1);
                }
            }, [prefillPhone]);

            useEffect(() => {
                try {
                    const text = JSON.stringify(phones);
                    writeMigratedStorage(PHONE_REWARDS_STORAGE_KEY, text);
                } catch (_) {}
            }, [phones]);

            const showAlert = (message) => setAlertOpen({ show: true, message });
            const showConfirm = (message, onOk) => setConfirmOpen({ show: true, message, onOk });

            const handleSearchChange = (e) => {
                setSearchQuery(e.target.value.replace(/[^\d+]/g, ''));
                setCurrentPage(1);
            };

            const rewardPhoneDigits = (p) => {
                const fromNorm = String(p.normalized || '').replace(/[^\d]/g, '');
                if (fromNorm) return fromNorm;
                return normalizePhone(p.phone || '');
            };

            const filteredPhones = useMemo(() => {
                let result = phones;
                if (searchQuery) {
                    const searchTarget = String(searchQuery).replace(/[^\d]/g, '');
                    if (searchTarget) {
                        result = result.filter((p) => {
                            const digits = rewardPhoneDigits(p);
                            if (!digits) return false;
                            return digits.includes(searchTarget) || searchTarget.includes(digits);
                        });
                    }
                }
                if (filterStatus === 'claimed') result = result.filter((p) => p.claimed);
                else if (filterStatus === 'unclaimed') result = result.filter((p) => !p.claimed);
                else if (filterStatus === 'added') result = result.filter((p) => p.added);
                return result;
            }, [phones, searchQuery, filterStatus]);

            const paginatedPhones = useMemo(() => {
                const start = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredPhones.slice(start, start + ITEMS_PER_PAGE);
            }, [filteredPhones, currentPage]);

            const totalPages = Math.max(1, Math.ceil(filteredPhones.length / ITEMS_PER_PAGE));

            const toggleClaimStatus = (id) => setPhones((prev) => prev.map((p) => (p.id === id ? { ...p, claimed: !p.claimed } : p)));
            const toggleAddedStatus = (id) => setPhones((prev) => prev.map((p) => (p.id === id ? { ...p, added: !p.added } : p)));

            const deletePhone = (id) => {
                showConfirm(t('confirmDelPhone'), () => {
                    setPhones((prev) => prev.filter((p) => p.id !== id));
                    setSelectedIds((prev) => {
                        const next = new Set(prev);
                        next.delete(id);
                        return next;
                    });
                });
            };

            const deleteSelected = () => {
                if (selectedIds.size === 0) return;
                showConfirm(t('confirmDelSelected').replace('{n}', selectedIds.size), () => {
                    setPhones((prev) => prev.filter((p) => !selectedIds.has(p.id)));
                    setSelectedIds(new Set());
                });
            };

            const toggleSelectAll = () => {
                const currentPageIds = paginatedPhones.map((p) => p.id);
                const allSelected = currentPageIds.length > 0 && currentPageIds.every((id) => selectedIds.has(id));
                setSelectedIds((prev) => {
                    const next = new Set(prev);
                    if (allSelected) currentPageIds.forEach((id) => next.delete(id));
                    else currentPageIds.forEach((id) => next.add(id));
                    return next;
                });
            };

            const toggleSelect = (id) => {
                setSelectedIds((prev) => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const stats = useMemo(
                () => ({
                    total: phones.length,
                    claimed: phones.filter((p) => p.claimed).length,
                    unclaimed: phones.filter((p) => !p.claimed).length,
                    added: phones.filter((p) => p.added).length,
                }),
                [phones],
            );

            const phoneRewardStatusText = (p) => {
                const parts = [];
                if (p?.claimed) parts.push(t('statusClaimedLabel'));
                if (p?.added) parts.push(t('statusAddedLabel'));
                return parts.join(' / ');
            };

            const exportPhonesByStatus = () => {
                let rows = phones;
                if (exportStatus === 'claimed') rows = rows.filter((p) => p.claimed);
                else if (exportStatus === 'unclaimed') rows = rows.filter((p) => !p.claimed);
                else if (exportStatus === 'added') rows = rows.filter((p) => p.added);
                if (!rows.length) {
                    showAlert(t('exportNoData'));
                    return;
                }
                const csvEscape = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
                const header = [t('phoneNum'), t('status')].map(csvEscape).join(',');
                const body = rows.map((p) => [p.phone || rewardPhoneDigits(p), phoneRewardStatusText(p)].map(csvEscape).join(','));
                const blob = new Blob(['\ufeff' + [header, ...body].join('\n')], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                a.href = url;
                a.download = `phone-rewards-${exportStatus}-${stamp}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 800);
            };

            const onImportBatch = (newPhones) => {
                const existingNormalized = new Set(phones.map((p) => p.normalized));
                const uniqueNewPhones = newPhones.filter((p) => !existingNormalized.has(p.normalized));
                setPhones((prev) => [...uniqueNewPhones, ...prev]);
                setShowImportModal(false);
                if (uniqueNewPhones.length < newPhones.length) {
                    showAlert(t('importSuccessFiltered').replace('{n1}', uniqueNewPhones.length).replace('{n2}', String(newPhones.length - uniqueNewPhones.length)));
                } else {
                    showAlert(t('importSuccessAll').replace('{n}', String(uniqueNewPhones.length)));
                }
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 min-h-0 text-slate-800">
                    <div className="shrink-0 theme-primary-btn px-3 py-2 flex items-center justify-between gap-2">
                        <span className="font-bold text-[13px] text-white truncate">{t('phoneManager')}</span>
                        <button type="button" onClick={onClose} className="p-1 rounded-lg hover:bg-white/20 text-white">
                            <SVG.XCircle c="w-5 h-5" />
                        </button>
                    </div>
                    <div className="shrink-0 bg-blue-600 px-2 py-2 flex flex-wrap gap-1.5 items-center justify-center border-b border-blue-700/30">
                        <button
                            type="button"
                            onClick={() => {
                                setFilterStatus('all');
                                setCurrentPage(1);
                            }}
                            className={`px-2 py-1 rounded-md text-[10px] font-bold transition-colors ${filterStatus === 'all' ? 'bg-white text-blue-600 shadow' : 'text-blue-100 hover:bg-blue-700'}`}
                        >
                            {t('total')} <span className="text-sm">{stats.total}</span>
                        </button>
                        <button
                            type="button"
                            onClick={() => {
                                setFilterStatus('claimed');
                                setCurrentPage(1);
                            }}
                            className={`px-2 py-1 rounded-md text-[10px] font-bold transition-colors ${filterStatus === 'claimed' ? 'bg-white text-green-600 shadow' : 'text-green-200 hover:bg-blue-700'}`}
                        >
                            {t('claimed')} <span className="text-sm">{stats.claimed}</span>
                        </button>
                        <button
                            type="button"
                            onClick={() => {
                                setFilterStatus('unclaimed');
                                setCurrentPage(1);
                            }}
                            className={`px-2 py-1 rounded-md text-[10px] font-bold transition-colors ${filterStatus === 'unclaimed' ? 'bg-white text-orange-600 shadow' : 'text-orange-200 hover:bg-blue-700'}`}
                        >
                            {t('unclaimed')} <span className="text-sm">{stats.unclaimed}</span>
                        </button>
                        <button
                            type="button"
                            onClick={() => {
                                setFilterStatus('added');
                                setCurrentPage(1);
                            }}
                            className={`px-2 py-1 rounded-md text-[10px] font-bold transition-colors ${filterStatus === 'added' ? 'bg-white text-cyan-600 shadow' : 'text-cyan-100 hover:bg-blue-700'}`}
                        >
                            {t('added')} <span className="text-sm">{stats.added}</span>
                        </button>
                    </div>
                    <div className="shrink-0 bg-white p-2 border-b space-y-2">
                        <div className="relative">
                            <SVG.Search c="absolute left-2 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />
                            <input
                                type="text"
                                className="w-full pl-8 pr-8 py-2 border border-slate-200 rounded-lg bg-slate-50 text-[13px] outline-none focus:border-blue-400"
                                placeholder={t('searchPhonePlaceholder')}
                                value={searchQuery}
                                onChange={handleSearchChange}
                            />
                            {searchQuery && (
                                <button type="button" onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400">
                                    <SVG.XCircle c="w-4 h-4" />
                                </button>
                            )}
                        </div>
                        <select
                            value={filterStatus}
                            onChange={(e) => {
                                setFilterStatus(e.target.value);
                                setCurrentPage(1);
                            }}
                            className="w-full border border-slate-200 rounded-lg px-2 py-1.5 text-[11px] bg-slate-50 outline-none soft-select"
                        >
                            <option value="all">{t('allStatus')}</option>
                            <option value="claimed">{t('onlyClaimed')}</option>
                            <option value="unclaimed">{t('onlyUnclaimed')}</option>
                            <option value="added">{t('onlyAdded')}</option>
                        </select>
                        <div className="flex gap-2">
                            <select
                                value={exportStatus}
                                onChange={(e) => setExportStatus(e.target.value)}
                                className="flex-1 min-w-0 border border-slate-200 rounded-lg px-2 py-1.5 text-[11px] bg-slate-50 outline-none soft-select"
                            >
                                <option value="all">{t('exportAll')}</option>
                                <option value="claimed">{t('exportClaimed')}</option>
                                <option value="unclaimed">{t('exportUnclaimed')}</option>
                                <option value="added">{t('exportAdded')}</option>
                            </select>
                            <button
                                type="button"
                                onClick={exportPhonesByStatus}
                                className="px-3 py-1.5 rounded-lg border border-blue-200 bg-blue-50 text-blue-600 text-[11px] font-bold hover:bg-blue-100"
                            >
                                {t('batchExport')}
                            </button>
                        </div>
                        <div className="flex gap-2">
                            <button type="button" onClick={() => setShowImportModal(true)} className="flex-1 flex items-center justify-center gap-1 theme-primary-btn py-2 rounded-lg text-[11px] font-bold">
                                <SVG.UserPlus c="w-3.5 h-3.5" /> {t('batchImport')}
                            </button>
                            <button
                                type="button"
                                onClick={deleteSelected}
                                disabled={selectedIds.size === 0}
                                className={`flex-1 flex items-center justify-center gap-1 py-2 rounded-lg text-[11px] font-bold ${selectedIds.size > 0 ? 'bg-red-500 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                            >
                                <SVG.Trash2 c="w-3.5 h-3.5" /> {t('deleteSelected')}
                                {selectedIds.size > 0 ? ` (${selectedIds.size})` : ''}
                            </button>
                        </div>
                    </div>
                    <div className="flex-1 min-h-0 overflow-auto bg-white">
                        <table className="min-w-full text-left text-[11px]">
                            <thead className="bg-slate-50 sticky top-0 z-[1]">
                                <tr>
                                    <th className="px-2 py-2 w-8">
                                        <input
                                            type="checkbox"
                                            className="rounded border-slate-300 w-3.5 h-3.5"
                                            checked={paginatedPhones.length > 0 && paginatedPhones.every((p) => selectedIds.has(p.id))}
                                            onChange={toggleSelectAll}
                                        />
                                    </th>
                                    <th className="px-2 py-2 font-semibold text-slate-500">{t('phoneNum')}</th>
                                    <th className="px-2 py-2 font-semibold text-slate-500">{t('status')}</th>
                                    <th className="px-2 py-2 font-semibold text-slate-500 text-right">{t('actions')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {paginatedPhones.length === 0 ? (
                                    <tr>
                                        <td colSpan="4" className="px-4 py-12 text-center text-slate-400">
                                            {searchQuery ? t('noMatchPhone') : t('emptyPhone')}
                                        </td>
                                    </tr>
                                ) : (
                                    paginatedPhones.map((item) => (
                                        <tr key={item.id} className="border-t border-slate-100 hover:bg-blue-50/30">
                                            <td className="px-2 py-2 align-middle">
                                                <input type="checkbox" className="rounded border-slate-300 w-3.5 h-3.5" checked={selectedIds.has(item.id)} onChange={() => toggleSelect(item.id)} />
                                            </td>
                                            <td className="px-2 py-2 align-middle">
                                                <div className="font-mono font-bold text-slate-700 text-[12px]">{item.phone}</div>
                                            </td>
                                            <td className="px-2 py-2 align-middle">
                                                <div className="flex flex-wrap gap-1">
                                                    {item.claimed ? (
                                                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-green-100 text-green-700 border border-green-200">
                                                            <SVG.CheckCircle c="w-3 h-3" /> {t('statusClaimedLabel')}
                                                        </span>
                                                    ) : null}
                                                    {item.added ? (
                                                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-cyan-100 text-cyan-700 border border-cyan-200">
                                                            <SVG.UserPlus c="w-3 h-3" /> {t('statusAddedLabel')}
                                                        </span>
                                                    ) : null}
                                                </div>
                                            </td>
                                            <td className="px-2 py-2 text-right align-middle whitespace-nowrap">
                                                <button
                                                    type="button"
                                                    onClick={() => toggleClaimStatus(item.id)}
                                                    className={`mr-1 px-2 py-1 rounded border text-[10px] font-bold ${item.claimed ? 'border-slate-200 text-slate-600' : 'border-blue-500 text-blue-600'}`}
                                                >
                                                    {item.claimed ? t('revoke') : t('markClaimed')}
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => toggleAddedStatus(item.id)}
                                                    className={`mr-1 px-2 py-1 rounded border text-[10px] font-bold ${item.added ? 'border-slate-200 text-slate-600' : 'border-cyan-500 text-cyan-600'}`}
                                                >
                                                    {item.added ? t('revoke') : t('markAdded')}
                                                </button>
                                                <button type="button" onClick={() => deletePhone(item.id)} className="text-red-500 p-1 rounded hover:bg-red-50 inline-flex">
                                                    <SVG.Trash2 c="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                    {filteredPhones.length > ITEMS_PER_PAGE && (
                        <div className="shrink-0 bg-slate-50 px-2 py-2 border-t flex items-center justify-between text-[10px]">
                            <span className="text-slate-600">
                                {t('totalPrefix')} <b>{filteredPhones.length}</b> {t('items')}
                            </span>
                            <div className="flex items-center gap-1">
                                <button
                                    type="button"
                                    onClick={() => setCurrentPage((p) => Math.max(1, p - 1))}
                                    disabled={currentPage === 1}
                                    className="px-2 py-1 rounded border bg-white disabled:opacity-40"
                                >
                                    {t('prevPage')}
                                </button>
                                <span className="px-1">
                                    {currentPage} / {totalPages}
                                </span>
                                <button
                                    type="button"
                                    onClick={() => setCurrentPage((p) => Math.min(totalPages, p + 1))}
                                    disabled={currentPage === totalPages}
                                    className="px-2 py-1 rounded border bg-white disabled:opacity-40"
                                >
                                    {t('nextPage')}
                                </button>
                            </div>
                        </div>
                    )}

                    {showImportModal && <PhoneImportModal onClose={() => setShowImportModal(false)} onImport={onImportBatch} />}

                    {alertOpen.show && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-3 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 text-center">
                                <h3 className="text-sm font-bold mb-2">{t('sysPrompt')}</h3>
                                <p className="text-slate-600 text-[12px] mb-4">{alertOpen.message}</p>
                                <button type="button" onClick={() => setAlertOpen({ show: false, message: '' })} className="w-full py-2 rounded-lg theme-primary-btn text-[12px] font-bold">
                                    {t('iKnow')}
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmOpen.show && (
                        <div className="fixed inset-0 z-[210] flex items-center justify-center p-3 bg-black/50">
                            <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-4 text-center">
                                <h3 className="text-sm font-bold mb-2">{t('confirmAction')}</h3>
                                <p className="text-slate-600 text-[12px] mb-4">{confirmOpen.message}</p>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setConfirmOpen({ show: false, message: '', onOk: null })} className="flex-1 py-2 rounded-lg border text-[12px] font-medium">
                                        {t('cancel')}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            confirmOpen.onOk && confirmOpen.onOk();
                                            setConfirmOpen({ show: false, message: '', onOk: null });
                                        }}
                                        className="flex-1 py-2 rounded-lg bg-red-600 text-white text-[12px] font-bold"
                                    >
                                        {t('confirmBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SeatWebview({ seatId, activeSeatId, webviewSrc, webpreferences, webviewRef, webviewRefsBySeatRef, onWebviewReady, onWebviewEvent }) {
            const onWebviewReadyRef = useRef(onWebviewReady);
            const onWebviewEventRef = useRef(onWebviewEvent);
            useEffect(() => {
                onWebviewReadyRef.current = onWebviewReady;
            }, [onWebviewReady]);
            useEffect(() => {
                onWebviewEventRef.current = onWebviewEvent;
            }, [onWebviewEvent]);
            const isActive = String(activeSeatId) === String(seatId);
            useEffect(() => {
                const el = webviewRefsBySeatRef.current[String(seatId)] || null;
                if (isActive) webviewRef.current = el;
            }, [isActive, seatId]);

            const setSeatWebviewRef = (node) => {
                const sid = String(seatId);
                if (node) {
                    webviewRefsBySeatRef.current[sid] = node;
                    if (isActive) webviewRef.current = node;
                    return;
                }
                if (webviewRefsBySeatRef.current[sid]) delete webviewRefsBySeatRef.current[sid];
                if (isActive && webviewRef.current && webviewRef.current.__fastgcSeatId === sid) webviewRef.current = null;
            };

            useEffect(() => {
                const sid = String(seatId);
                const el = webviewRefsBySeatRef.current[sid];
                if (!el) return undefined;
                el.__fastgcSeatId = sid;
                try { el.setAttribute('useragent', WA_UA); } catch (_) {}
                if (typeof el.addEventListener !== 'function') return undefined;
                const isWhatsAppUrl = () => {
                    try {
                        const href = typeof el.getURL === 'function' ? String(el.getURL() || '') : String(el.getAttribute('src') || '');
                        return /web\.whatsapp\.com/i.test(href || webviewSrc || '');
                    } catch (_) {
                        return /web\.whatsapp\.com/i.test(String(webviewSrc || ''));
                    }
                };
                const reloadWhatsApp = (reason = '') => {
                    if (!isWhatsAppUrl()) return;
                    const now = Date.now();
                    if (el.__fastgcLastAutoReloadAt && now - el.__fastgcLastAutoReloadAt < 30000) return;
                    el.__fastgcLastAutoReloadAt = now;
                    el.__fastgcDomReady = false;
                    try {
                        if (typeof el.reloadIgnoringCache === 'function') {
                            el.reloadIgnoringCache();
                            return;
                        }
                        if (typeof el.reload === 'function') {
                            el.reload();
                            return;
                        }
                    } catch (_) {}
                    safeWebviewLoadURL(el, waUrlByLang(document.documentElement.lang === 'en' ? 'en' : 'zh'));
                };
                const onFail = (e) => {
                    if (e && e.isMainFrame === false) return;
                    console.error('webview load failed', sid, e);
                    setTimeout(() => reloadWhatsApp('did-fail-load'), 1200);
                };
                const onLoadStart = () => {
                    el.__fastgcDomReady = false;
                };
                const onReady = () => {
                    el.__fastgcDomReady = true;
                    el.__fastgcHealthMisses = 0;
                    const cb = onWebviewReadyRef.current;
                    if (cb) cb(sid);
                    void (async () => {
                        try {
                            if (el.__fastgcWaDevtoolsOpened) return;
                            const enabled =
                                window.fastgcBridge &&
                                typeof window.fastgcBridge.waWebviewDevtoolsEnabled === 'function' &&
                                (await window.fastgcBridge.waWebviewDevtoolsEnabled());
                            if (!enabled || !isWhatsAppUrl() || typeof el.openDevTools !== 'function') return;
                            el.__fastgcWaDevtoolsOpened = true;
                            el.openDevTools();
                        } catch (_) {}
                    })();
                };
                const onStopLoading = () => {
                    if (isWebviewReady(el)) {
                        el.__fastgcDomReady = true;
                        el.__fastgcHealthMisses = 0;
                    }
                };
                const onUnresponsive = () => reloadWhatsApp('unresponsive');
                const onRenderGone = () => reloadWhatsApp('render-process-gone');
                const onIpcMessage = (e) => {
                    if (!e || e.channel !== 'fastgc-wa-event') return;
                    const payload = Array.isArray(e.args) ? e.args[0] : null;
                    el.__fastgcHealthMisses = 0;
                    const cb = onWebviewEventRef.current;
                    if (cb) cb(payload, sid);
                };
                const healthPeriodMs = isActive ? WA_SEAT_HEALTH_INTERVAL_ACTIVE_MS : WA_SEAT_HEALTH_INTERVAL_IDLE_MS;
                const healthTimer = setInterval(async () => {
                    if (!isWhatsAppUrl() || !isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return;
                    const res = await safeWebviewExecute(
                        el,
                        `(() => ({ ok: true, href: location.href, title: document.title, ts: Date.now() }))();`,
                        false,
                        600,
                        1200,
                    );
                    if (res?.ok) {
                        el.__fastgcHealthMisses = 0;
                        return;
                    }
                    el.__fastgcHealthMisses = Number(el.__fastgcHealthMisses || 0) + 1;
                    if (el.__fastgcHealthMisses >= 2) reloadWhatsApp('health-timeout');
                }, healthPeriodMs);
                el.addEventListener('did-fail-load', onFail);
                el.addEventListener('did-start-loading', onLoadStart);
                el.addEventListener('did-stop-loading', onStopLoading);
                el.addEventListener('dom-ready', onReady);
                el.addEventListener('unresponsive', onUnresponsive);
                el.addEventListener('render-process-gone', onRenderGone);
                el.addEventListener('ipc-message', onIpcMessage);
                return () => {
                    clearInterval(healthTimer);
                    el.__fastgcDomReady = false;
                    el.removeEventListener('did-fail-load', onFail);
                    el.removeEventListener('did-start-loading', onLoadStart);
                    el.removeEventListener('did-stop-loading', onStopLoading);
                    el.removeEventListener('dom-ready', onReady);
                    el.removeEventListener('unresponsive', onUnresponsive);
                    el.removeEventListener('render-process-gone', onRenderGone);
                    el.removeEventListener('ipc-message', onIpcMessage);
                };
            }, [seatId, webpreferences, webviewSrc, isActive]);

            return (
                <webview
                    key={`${seatId}-${webviewSrc}`}
                    ref={setSeatWebviewRef}
                    src={webviewSrc}
                    partition={`${WA_PARTITION_PREFIX}${seatId}`}
                    allowpopups="true"
                    webpreferences={webpreferences}

                        minHeight: 0,
                        display: isActive ? 'flex' : 'none',
                        opacity: isActive ? 1 : 0,
                        pointerEvents: isActive ? 'auto' : 'none',
                        zIndex: isActive ? 2 : 1,
                    }}
                />
            );
        }

        const App = () => {

            const [showLinkManager, setShowLinkManager] = useState(false);
