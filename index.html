                /** 同 key 并发翻译合并为单次网络/桥调用，避免 MutationObserver 连发时打爆桥或 gtx */
                const inflightTranslateByKey = new Map();
                const FASTGC_BRIDGE_MS = Math.max(4000, Math.min(Number(window.__FASTGC_TRANSLATE_BRIDGE_MS) || 24000, 60000));
                const FASTGC_FALLBACK_FETCH_MS = Math.max(2500, Math.min(Number(window.__FASTGC_TRANSLATE_FALLBACK_MS) || 11500, 60000));
                const withFastgcTranslateTimeout = (promise, ms) =>
                    Promise.race([
                        promise,
                        new Promise((_, reject) => setTimeout(() => reject(new Error('TRANSLATE_TIMEOUT')), Math.max(450, Number(ms) || FASTGC_BRIDGE_MS))),
                    ]);
                const extractGtxTranslateText = (data) => {
                    if (!Array.isArray(data) || !Array.isArray(data[0])) return '';
                    return data[0].map((item) => (item != null && Array.isArray(item) ? String(item[0] == null ? '' : item[0]) : '')).join('').trim();
                };
                const fetchGtxTranslateOnce = async (normInput, sl, tl, bridgeError) => {
                    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + encodeURIComponent(sl) + '&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(normInput);
                    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
                    const timer = controller ? setTimeout(() => controller.abort(), FASTGC_FALLBACK_FETCH_MS) : null;
                    try {
                        const res = await fetch(url, {
                            method: 'GET',
                            cache: 'no-store',
                            headers: {
                                Accept: '*/*',
                                'Accept-Language': (typeof navigator !== 'undefined' && navigator.language) ? navigator.language + ',en;q=0.9' : 'en-US,en;q=0.9',
                            },
                            ...(controller ? { signal: controller.signal } : {}),
                        });
                        if (!res.ok) return { ok: false, text: normInput, error: 'HTTP_' + res.status, bridgeError };
                        const rawText = await res.text();
                        let data = null;
                        try {
                            data = rawText ? JSON.parse(rawText.trim()) : null;
                        } catch (_) {
                            return { ok: false, text: normInput, error: 'PARSE_JSON', bridgeError };
                        }
                        const translated = extractGtxTranslateText(data);
                        if (!translated) return { ok: false, text: normInput, error: 'PARSE_EMPTY', bridgeError };
                        return { ok: true, text: translated, source: 'fallback-fetch', bridgeError };
                    } catch (err) {
                        return { ok: false, text: normInput, error: err && err.message ? String(err.message) : String(err || 'FETCH_ERROR'), bridgeError };
                    } finally {
                        if (timer) clearTimeout(timer);
                    }
                };
                const translateTextFastgcDetailed = async (text, sourceLang, targetLang) => {
                    const sl = normalizeFastgcTranslateLang(sourceLang, 'auto');
                    const tl = normalizeFastgcTranslateLang(targetLang, 'en');
                    const normInput = normalizeTranslatePlainText(text);
                    if (!normInput) return { ok: true, text: String(text || ''), skipped: 'empty' };
                    if (sl !== 'auto' && sl.toLowerCase() === tl.toLowerCase()) return { ok: true, text: normInput, skipped: 'same-language' };
                    let translateProvider = 'web';
                    try {
                        if (window.__fastgcTranslateBridge && typeof window.__fastgcTranslateBridge.getPolicy === 'function') {
                            const policy = window.__fastgcTranslateBridge.getPolicy();
                            if (!policy || !policy.ok) return { ok: false, error: policy && policy.error || 'CLOUD_POLICY_UNAVAILABLE' };
                            translateProvider = policy.provider;
                        }
                    } catch (_) { return { ok: false, error: 'CLOUD_POLICY_UNAVAILABLE' }; }
                    const ck = translateProvider + '|' + localTransCacheKey(sl, tl, normInput);
                    const memo = localTransCacheGet(ck);
                    if (memo != null) return { ok: true, text: memo, cached: true };
                    const existing = inflightTranslateByKey.get(ck);
                    if (existing) return await existing;
                    const run = Promise.resolve().then(async () => {
                        let bridgeError = '';
                        try {
                            if (window.__fastgcTranslateBridge && typeof window.__fastgcTranslateBridge.translate === 'function') {
                                const r = await withFastgcTranslateTimeout(window.__fastgcTranslateBridge.translate(normInput, sl, tl), FASTGC_BRIDGE_MS);
                                if (r && r.ok && typeof r.text === 'string' && r.text.trim()) {
                                    const out = String(r.text).trim();
                                    localTransCacheSet(ck, out);
                                    return { ok: true, text: out, source: 'bridge', cached: !!r.cached };
                                }
                                bridgeError = String((r && (r.error || r.reason || r.status)) || 'BRIDGE_EMPTY');
                                if (r && r.noFallback) return { ok: false, text: normInput, error: bridgeError, retryAfterMs: r.retryAfterMs || 0 };
                            }
                        } catch (err) {
                            bridgeError = err && err.message ? String(err.message) : String(err || 'BRIDGE_ERROR');
                        }
                        if (translateProvider === 'google-cloud-nmt') {
                            return { ok: false, text: normInput, error: bridgeError || 'CLOUD_BRIDGE_UNAVAILABLE' };
                        }
                        let gtx = await fetchGtxTranslateOnce(normInput, sl, tl, bridgeError);
                        if (gtx && gtx.ok && gtx.text) {
                            const out = String(gtx.text).trim();
                            localTransCacheSet(ck, out);
                            return { ok: true, text: out, source: gtx.source || 'fallback-fetch' };
                        }

    };
    var isRepeatedCompose = function(got, want) {
      var g = normCompose(got);
      var w = normCompose(want);
      if (!g || !w || g === w) return false;
      return g === w + w || g === w + ' ' + w || (g.length > w.length && g.indexOf(w) === 0 && g.split(w).join('').trim() === '');

    var writeCompose = async function(text) {
      var active = currentBox();

      var writeOnce = async function(useWpp){

        active = (await forceClearCompose(active)) || active;
        if (!active) return false;
        if (readCompose()) return false;
        if (useWpp && await tryWppSetInputText(text)) return true;
        writeComposeDom(active, text);
        return await waitForComposeText(text, sendOpts.composeWriteMs);
      };
      try { await writeOnce(true); } catch (e1) {}
      if (await waitForComposeText(text, sendOpts.composeWriteMs)) return currentBox();
      if (isRepeatedCompose(readCompose(), text)) {
        active = (await forceClearCompose(active)) || active;
      }
      try {
        active = currentBox();
        if (!active) return null;
        await writeOnce(false);
      } catch (e5) {}
      if (await waitForComposeText(text, sendOpts.composeWriteMs)) return currentBox();
      return null;
    };
    box = (await writeCompose(outText)) || box;
    if (!(await waitForComposeText(outText, sendOpts.composeApplyMs))) return { ok: false, reason: 'compose-not-applied' };
    if (readCompose() !== normCompose(outText)) return { ok: false, reason: 'compose-mismatch' };
    await wait(32);

    if (!sendBtn) sendBtn = document.querySelector('button[data-testid="send"]');
    if (!sendBtn) {

    return { ok: true, via: 'enter' };
  } catch (e) {
    return { ok: false, reason: String(e && e.message ? e.message : e) };

})()

            const [canScrollRight, setCanScrollRight] = useState(false);
            const scrollStateRafRef = useRef(null);
            const lastArrowRef = useRef({ left: false, right: false });
            const updateScrollState = () => {
                const el = freeScrollRef.current;
                if (!el) {
                    if (lastArrowRef.current.left || lastArrowRef.current.right) {
                        lastArrowRef.current = { left: false, right: false };
                        setCanScrollLeft(false);
                        setCanScrollRight(false);
                    }
                    return;
                }
                const maxLeft = Math.max(0, el.scrollWidth - el.clientWidth);
                const nextL = el.scrollLeft > 2;
                const nextR = el.scrollLeft < maxLeft - 2;
                if (nextL !== lastArrowRef.current.left || nextR !== lastArrowRef.current.right) {
                    lastArrowRef.current = { left: nextL, right: nextR };
                    setCanScrollLeft(nextL);
                    setCanScrollRight(nextR);
                }
            };
            const scheduleScrollState = () => {
                if (scrollStateRafRef.current != null) return;

            const scrollFreeBy = (delta) => {

        function DiagnosticsPanel({ t, lang, activeSeatId, onCleanupTranslateUiActiveSeat, onClearGlobalInboxCache, onClearWaPhoneCaches }) {
            const [snap, setSnap] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [migrateBusy, setMigrateBusy] = useState(false);
            const mb = (n) => {
                const v = Number(n || 0);
                if (!Number.isFinite(v) || v <= 0) return '0 MB';
                return (v / (1024 * 1024)).toFixed(v >= 1024 * 1024 * 1024 ? 1 : 2) + ' MB';
            };
            const refresh = async () => {
                setLoading(true);
                setError('');
                try {
                    const bridge = window.fastgcBridge;
                    if (!bridge?.getDiagnosticsSnapshot) {
                        setError(lang === 'zh' ? '当前环境不支持诊断接口（仅安装版可用）' : 'Diagnostics bridge not available.');
                        setLoading(false);
                        return;
                    }
                    const r = await bridge.getDiagnosticsSnapshot();
                    if (!r?.ok) {
                        setError(String(r?.error || 'unknown'));
                        setLoading(false);
                        return;
                    }
                    setSnap(r);
                } catch (e) {
                    setError(e instanceof Error ? e.message : String(e));
                } finally {
                    setLoading(false);
                }
            };
            useEffect(() => {
                void refresh();
            }, []);

            /** 缓存类操作：连续两次 confirm 均点「确定」后才执行 fn（含 async）。 */
            const confirmTwice = (primaryMsg, finalMsg, fn) => {
                try {
                    if (!window.confirm(primaryMsg)) return;
                    if (!window.confirm(finalMsg)) return;
                } catch (_) {
                    return;
                }
                try {
                    const out = fn && fn();
                    if (out != null && typeof out.then === 'function') void out.catch(() => {});
                } catch (_) {}
            };

            const clearTranslateCache = async () => {
                const bridge = window.fastgcBridge;
                if (!bridge?.clearTranslateCache) return;
                const primary = lang === 'zh'
                    ? '确定清理翻译缓存？不会影响 WhatsApp 登录，但会降低接下来一段时间的翻译命中率（会重新走 Google）。'
                    : 'Clear translation cache? This won’t log you out, but upcoming translations may re-call Google.';
                const finalAsk = lang === 'zh'
                    ? '再次确认：真的要清理翻译缓存吗？'
                    : 'Confirm again: clear translation cache?';
                confirmTwice(primary, finalAsk, async () => {
                    try {
                        await bridge.clearTranslateCache();
                    } catch (_) {}
                    void refresh();
                });
            };

            const clearTranslateUi = () => {
                const primary = lang === 'zh'
                    ? '确定清理当前席位的消息译文展示？不会删除 WhatsApp 消息，只会移除 FastGC 插入的译文提示。'
                    : 'Remove translated overlays for the active seat? This only removes FastGC-inserted UI.';
                const finalAsk = lang === 'zh'
                    ? '再次确认：真的要清理译文展示吗？'
                    : 'Confirm again: remove translation UI?';
                confirmTwice(primary, finalAsk, () => onCleanupTranslateUiActiveSeat && onCleanupTranslateUiActiveSeat());
            };

            const clearGlobalInbox = () => {
                const primary = lang === 'zh'
                    ? '确定清理「全局消息汇聚」缓存？会清空汇聚列表与角标，本机稍后会重新扫描生成。'
                    : 'Clear global inbox cache? It will be rebuilt after rescan.';
                const finalAsk = lang === 'zh'
                    ? '再次确认：真的要清理全局汇聚缓存吗？'
                    : 'Confirm again: clear global inbox cache?';
                confirmTwice(primary, finalAsk, () => onClearGlobalInboxCache && onClearGlobalInboxCache());
            };

            const clearWaPhoneCaches = () => {
                const primary = lang === 'zh'
                    ? '确定清理号码/会话绑定相关缓存？可能需要重新采号/重新绑定，会增加短期工作量。'
                    : 'Clear phone/chat binding caches? It may require re-collection and increase short-term workload.';
                const finalAsk = lang === 'zh'
                    ? '再次确认：真的要清理号码/绑定相关缓存吗？'
                    : 'Confirm again: clear phone/binding caches?';
                confirmTwice(primary, finalAsk, () => onClearWaPhoneCaches && onClearWaPhoneCaches());
            };

            const lightCleanup = async () => {
                const primary = lang === 'zh'
                    ? '执行轻量清理：清理译文展示 + 翻译缓存 + 全局汇聚缓存。不会导致重新扫码登录。继续？'
                    : 'Run light cleanup: translation UI + translation cache + global inbox cache (no re-login). Continue?';
                const finalAsk = lang === 'zh'
                    ? '再次确认：真的要执行一键轻量清理吗？'
                    : 'Confirm again: run light cleanup?';
                confirmTwice(primary, finalAsk, async () => {
                    try {
                        onCleanupTranslateUiActiveSeat && onCleanupTranslateUiActiveSeat();
                    } catch (_) {}
                    try {
                        const bridge = window.fastgcBridge;
                        if (bridge?.clearTranslateCache) await bridge.clearTranslateCache();
                    } catch (_) {}
                    try {
                        onClearGlobalInboxCache && onClearGlobalInboxCache();
                    } catch (_) {}
                    void refresh();
                });
            };

            const rerunSqliteMigration = async () => {
                const bridge = window.fastgcBridge;
                if (!bridge?.storageMigrateBatch) return;
                const ask = lang === 'zh'
                    ? '将重新执行 SQLite 迁移（幂等），用于修复数据落库不完整。继续？'
                    : 'Re-run idempotent SQLite migration to repair incomplete writes. Continue?';
                if (!window.confirm(ask)) return;
                setMigrateBusy(true);
                try {
                    const items = SQLITE_MIGRATION_KEYS.map((key) => ({
                        key,
                        value: String(localStorage.getItem(key) || ''),
                    })).filter((it) => it.value);
                    if (items.length > 0) await bridge.storageMigrateBatch({ items });
                    if (bridge.storageSet) await bridge.storageSet({ key: SQLITE_MIGRATION_MARK_KEY, value: '1' });
                    try { localStorage.setItem(SQLITE_MIGRATION_MARK_KEY, '1'); } catch (_) {}
                    await refresh();
                } catch (e) {
                    setError(e instanceof Error ? e.message : String(e));
                } finally {
                    setMigrateBusy(false);
                }
            };

            const card = (title, children) => (
                <div className="border border-slate-200 rounded-xl p-3 bg-slate-50/60">
                    <div className="text-[11px] font-extrabold text-slate-700 mb-2">{title}</div>
                    {children}
                </div>
            );

            return (
                <div className="space-y-3">
                    {card(lang === 'zh' ? '资源占用' : 'Resource usage', (
                        <>
                            <div className="text-[10px] text-slate-500 mb-2">
                                {lang === 'zh' ? '仅展示大小/计数，不展示任何内容。' : 'Size/count only; no content is shown.'}
                            </div>
                            <div className="grid grid-cols-2 gap-2 text-[11px]">
                                <div className="bg-white border border-slate-200 rounded-lg p-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? 'userData 目录' : 'userData dir'}</div>
                                    <div className="font-mono font-extrabold text-slate-800">{mb(snap?.userDataBytes)}</div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-lg p-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? '翻译缓存文件' : 'Translate cache file'}</div>
                                    <div className="font-mono font-extrabold text-slate-800">{mb(snap?.translateCacheBytes)}</div>
                                    <div className="text-[10px] text-slate-400">{lang === 'zh' ? '条数' : 'entries'}: {Number(snap?.translateCacheEntries || 0)}</div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-lg p-2 col-span-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? '主进程内存（RSS/HeapUsed）' : 'Main memory (RSS/HeapUsed)'}</div>
                                    <div className="font-mono font-extrabold text-slate-800">
                                        {mb(snap?.memoryUsage?.rss)} / {mb(snap?.memoryUsage?.heapUsed)}
                                    </div>
                                    {snap?.memInfo ? (
                                        <div className="text-[10px] text-slate-400 font-mono mt-1">
                                            private: {mb(snap.memInfo.private || 0)} · shared: {mb(snap.memInfo.shared || 0)}
                                        </div>
                                    ) : null}
                                </div>
                            </div>
                            {error ? <div className="text-[10px] font-bold text-red-600 mt-2">{error}</div> : null}
                            <div className="mt-3 flex items-center gap-2">
                                <button type="button" onClick={refresh} disabled={loading} className="px-3 py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-50">
                                    {loading ? (lang === 'zh' ? '刷新中…' : 'Refreshing…') : (lang === 'zh' ? '刷新' : 'Refresh')}
                                </button>
                                <div className="text-[10px] text-slate-400 truncate min-w-0 flex-1">
                                    {snap?.userDataPath ? `userData: ${snap.userDataPath}` : ''}
                                </div>
                            </div>
                        </>
                    ))}

                    {card(lang === 'zh' ? 'SQLite 迁移状态' : 'SQLite migration status', (
                        <div className="space-y-2">
                            <div className="grid grid-cols-2 gap-2 text-[11px]">
                                <div className="bg-white border border-slate-200 rounded-lg p-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? '数据库可用' : 'DB available'}</div>
                                    <div className={`font-extrabold ${snap?.sqliteAvailable ? 'text-emerald-600' : 'text-amber-600'}`}>
                                        {snap?.sqliteAvailable ? (lang === 'zh' ? '是' : 'Yes') : (lang === 'zh' ? '否' : 'No')}
                                    </div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-lg p-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? '数据库文件大小' : 'DB file size'}</div>
                                    <div className="font-mono font-extrabold text-slate-800">{mb(snap?.sqliteBytes)}</div>
                                </div>
                                <div className="bg-white border border-slate-200 rounded-lg p-2 col-span-2">
                                    <div className="text-slate-500 font-bold">{lang === 'zh' ? '迁移状态' : 'Migration status'}</div>
                                    <div className={`font-extrabold ${snap?.sqliteMigrationDone ? 'text-emerald-600' : 'text-amber-600'}`}>
                                        {snap?.sqliteMigrationDone ? (lang === 'zh' ? '已完成' : 'Completed') : (lang === 'zh' ? '进行中' : 'In progress')}
                                    </div>
                                    <div className="text-[10px] text-slate-500 mt-1">
                                        {lang === 'zh' ? '覆盖 key' : 'Migrated keys'}: {Number(snap?.sqliteMigratedKeysCount || 0)} / {Number(snap?.sqliteMigrationTrackedCount || 0)}
                                    </div>
                                </div>
                            </div>
                            <div className="text-[10px] text-slate-400 truncate">
                                {snap?.sqlitePath ? `sqlite: ${snap.sqlitePath}` : ''}
                            </div>
                            <button
                                type="button"
                                onClick={rerunSqliteMigration}
                                disabled={migrateBusy}
                                className="w-full py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-700 hover:bg-slate-50 disabled:opacity-50"
                            >
                                {migrateBusy
                                    ? (lang === 'zh' ? '迁移执行中…' : 'Migration running…')
                                    : (lang === 'zh' ? '重新执行迁移（幂等）' : 'Re-run migration (idempotent)')}
                            </button>
                        </div>
                    ))}

                    {card(lang === 'zh' ? '缓存清理' : 'Cache cleanup', (
                        <div className="space-y-2">
                            <button type="button" onClick={lightCleanup} className="w-full py-2.5 rounded-xl theme-primary-btn text-[12px] font-extrabold shadow-lg">
                                {lang === 'zh' ? '一键轻量清理（推荐）' : 'Light cleanup (recommended)'}
                            </button>
                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={clearTranslateCache} className="py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-700 hover:bg-slate-50">
                                    {lang === 'zh' ? '清理翻译缓存' : 'Clear translate cache'}
                                </button>
                                <button type="button" onClick={clearTranslateUi} className="py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-700 hover:bg-slate-50">
                                    {lang === 'zh' ? '清理译文展示' : 'Remove translate UI'}
                                </button>
                                <button type="button" onClick={clearGlobalInbox} className="py-2 rounded-lg border border-slate-200 bg-white text-[11px] font-bold text-slate-700 hover:bg-slate-50">
                                    {lang === 'zh' ? '清理全局汇聚缓存' : 'Clear global inbox'}
                                </button>
                                <button type="button" onClick={clearWaPhoneCaches} className="py-2 rounded-lg border border-amber-200 bg-amber-50 text-[11px] font-bold text-amber-800 hover:bg-amber-100">
                                    {lang === 'zh' ? '清理号码绑定缓存' : 'Clear phone bindings'}
                                </button>
                            </div>
                            <div className="text-[10px] text-slate-500 leading-relaxed">
                                {lang === 'zh'
                                    ? '提示：本页不包含“清理 WhatsApp 登录会话（需重新扫码）”。如需深度清理可另做高级开关。'
                                    : 'Note: This page does not clear WhatsApp login session storage (re-scan QR).'}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        function CloudTranslationSettings() {
            const { lang } = useContext(LanguageContext);
            const zh = lang === 'zh';
            const [status, setStatus] = useState(null);
            const [provider, setProvider] = useState('google-cloud-nmt');
            const [projectId, setProjectId] = useState('');
            const [apiKey, setApiKey] = useState('');
            const [limit, setLimit] = useState(450000);
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState('');
            const [failed, setFailed] = useState(false);
            const errorText = (code) => {
                const messages = {
                    CLOUD_KEY_REQUIRED: ['请填写所属项目的 API Key。', 'Enter an API key for this project.'],
                    CLOUD_INVALID_KEY: ['API Key 格式不正确。', 'Invalid API key format.'],
                    CLOUD_INVALID_PROJECT: ['请填写有效的 Google Cloud 项目 ID。', 'Enter a valid Google Cloud project ID.'],
                    CLOUD_INVALID_LIMIT: ['保护上限需为 1 至 450000 的整数。', 'The limit must be an integer from 1 to 450000.'],
                    CLOUD_LOCAL_LIMIT_REACHED: ['已达本机保护上限，官方翻译已停止；已有缓存仍可使用。', 'Local limit reached. Cloud requests stopped; cached translations remain available.'],
                    CLOUD_PERMISSION_OR_BILLING: ['请检查 API Key 限制、Cloud Translation API 是否启用及项目计费状态。', 'Check key restrictions, API activation and project billing.'],
                    CLOUD_RATE_OR_QUOTA_LIMIT: ['Google 返回限流或配额不足，请在控制台检查。', 'Google returned a rate or quota limit. Check the console.'],
                    CLOUD_KEY_REJECTED: ['Google 拒绝了该 API Key，请检查密钥。', 'Google rejected this API key.'],
                    CLOUD_ENCRYPTION_UNAVAILABLE: ['系统加密不可用，无法安全保存或使用密钥。', 'OS encryption is unavailable; the key cannot be stored or used securely.'],
                    CLOUD_KEY_UNREADABLE: ['无法解密密钥，请重新填写并保存。', 'Could not decrypt the key. Enter and save it again.'],
                    CLOUD_CONFIG_UNREADABLE: ['翻译配置无法读取，已停止官方调用。', 'Translation configuration is unreadable. Cloud calls are stopped.'],
                    CLOUD_USAGE_UNREADABLE: ['用量记录无法读取，已停止官方调用。请保留数据并联系维护。', 'Usage records are unreadable. Cloud calls are stopped. Preserve your data and contact support.'],
                    CLOUD_NOT_SELECTED: ['请先保存并启用 Google Cloud NMT。', 'Save and enable Google Cloud NMT first.'],
                    CLOUD_NETWORK_OR_TIMEOUT: ['连接 Google 超时或失败，请检查网络。', 'Google connection failed or timed out. Check your network.'],
                    CLOUD_TEXT_TOO_LONG: ['单次官方翻译最多支持 5000 个字符。', 'A cloud request supports up to 5000 characters.'],
                    CLOUD_SAVE_FAILED: ['配置保存失败，请检查磁盘空间。', 'Could not save settings. Check available disk space.'],
                };
                return messages[code]?.[zh ? 0 : 1] || (zh ? `操作失败：${code || 'UNKNOWN'}` : `Operation failed: ${code || 'UNKNOWN'}`);
            };
            const refresh = async (initial = false) => {
                try {
                    const result = await window.fastgcBridge.getCloudTranslation();
                    setStatus(result);
                    if (initial) {
                        setProvider(result.hasKey ? result.provider : 'google-cloud-nmt');
                        setProjectId(result.projectId || '');
                        setLimit(result.limit || 450000);
                    }
                    if (!result.ok) { setFailed(true); setMessage(errorText(result.error)); }
                } catch (_) { setFailed(true); setMessage(zh ? '无法读取翻译配置。' : 'Could not load translation settings.'); }
            };
            useEffect(() => { refresh(true); }, []);
            const save = async () => {
                setBusy(true); setMessage('');
                try {
                    const result = await window.fastgcBridge.setCloudTranslation({ provider, projectId, apiKey, limit: Number(limit) });
                    setFailed(!result.ok);
                    if (result.ok) {
                        setStatus(result); setApiKey('');
                        setMessage(zh ? '已保存并应用。' : 'Saved and applied.');
                    } else { setMessage(errorText(result.error)); }
                } catch (_) { setFailed(true); setMessage(zh ? '保存失败。' : 'Save failed.'); }
                finally { setBusy(false); }
            };
            const checkConnection = async () => {
                setBusy(true); setMessage('');
                try {
                    const result = await window.fastgcBridge.checkCloudTranslation();
                    if (result.settings) setStatus(result.settings);
                    setFailed(!result.ok);
                    setMessage(result.ok ? (zh ? `官方 NMT 连接成功：Hello → ${result.text}` : `NMT connected: Hello → ${result.text}`) : errorText(result.error));
                } catch (_) { setFailed(true); setMessage(zh ? '连接检查失败。' : 'Connection check failed.'); }
                finally { setBusy(false); }
            };
            return (
                <div className="space-y-3 text-[12px] text-slate-700" data-cloud-translation-settings>
                    <div className="rounded-xl border border-blue-100 bg-blue-50 p-3 space-y-1">
                        <h4 className="font-extrabold text-blue-900">Google Cloud NMT · Basic v2</h4>
                        <p>{zh ? 'Google 每月前 50 万字符以最高 10 美元抵扣额提供，项目仍需启用计费。' : 'Google offers up to $10 monthly credit for the first 500,000 NMT characters. Billing must be enabled.'}</p>
                        <p>{zh ? '当前服务：' : 'Current service: '}{status?.provider === 'google-cloud-nmt' ? 'Google Cloud NMT' : (zh ? 'Google 网页翻译（官方服务待配置）' : 'Google web translation (Cloud setup pending)')}</p>
                    </div>
                    <label className="block font-bold">{zh ? '翻译服务' : 'Translation service'}
                        <select value={provider} onChange={e => { setProvider(e.target.value); setMessage(''); }} className="mt-1 w-full rounded-lg border bg-white p-2">
                            <option value="google-cloud-nmt">Google Cloud NMT</option>
                            <option value="web">{zh ? '原有 Google 网页翻译' : 'Existing Google web translation'}</option>
                        </select>
                    </label>
                    <label className="block font-bold">{zh ? 'API Key 所属项目 ID' : 'API key project ID'}
                        <input value={projectId} onChange={e => setProjectId(e.target.value)} placeholder="my-translation-project" autoComplete="off" className="mt-1 w-full rounded-lg border p-2 font-mono font-normal" />
                    </label>
                    <label className="block font-bold">Google Cloud API Key
                        <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} autoComplete="off" spellCheck={false} placeholder={status?.hasKey ? (zh ? '密钥已加密保存；留空保留' : 'Encrypted key saved; leave blank to keep') : (zh ? '在此粘贴密钥，请勿发送到聊天中' : 'Paste the key here, not in chat')} className="mt-1 w-full rounded-lg border p-2 font-mono font-normal" />
                    </label>

        /** 左侧「内容与话术库」：与工具箱 ContentManager 一致（localStorage: content_manager_data） */
        function ContentManagerDrawer({ onClose, onCopy, onSend }) {
            const { t, lang } = useContext(LanguageContext);
            const [data, setData] = useState(() => readContentManagerInitial());
            const [activeCategoryId, setActiveCategoryId] = useState(() => readContentManagerInitial().categories[0]?.id || null);
            const [searchQuery, setSearchQuery] = useState('');
            const [showRecordModal, setShowRecordModal] = useState(false);
            const [editingRecord, setEditingRecord] = useState(null);
            const [showCategoryModal, setShowCategoryModal] = useState(false);
            const [newCategoryName, setNewCategoryName] = useState('');
            const [draggedIdx, setDraggedIdx] = useState(null);
            const [dragOverIdx, setDragOverIdx] = useState(null);
            const [alertOpen, setAlertOpen] = useState({ show: false, message: '' });
            const [confirmOpen, setConfirmOpen] = useState({ show: false, message: '', onOk: null });
            const [detailOpen, setDetailOpen] = useState({ show: false, title: '', content: '' });
            const categoryTabsRef = useRef(null);
            const [tabArrows, setTabArrows] = useState({ canScroll: false, canLeft: false, canRight: false });
            const [draggedCategoryIdx, setDraggedCategoryIdx] = useState(null);
            const [dragOverCategoryIdx, setDragOverCategoryIdx] = useState(null);

            /** 话术表：标题列双击发送；与全局「脚本库」一致做去重，避免事件冒泡或多击重复发送 */
            const contentSendGuardRef = useRef({ ts: 0, key: '', busy: false });
            const contentCopyGuardRef = useRef({ ts: 0, key: '' });
            const sendContentRowQuick = async (item, column = 'zh-title') => {
                let text = '';
                if (column === 'en-content') {
                    text = String(item.content || '').trim();
                } else {
                    const zhFirst = column === 'zh-title';
                    const primary = zhFirst ? item.contentZh : item.content;
                    const secondary = zhFirst ? item.content : item.contentZh;
                    text = String(primary || '').trim();
                    if (!text) text = String(secondary || '').trim();
                }
                if (!text) return;
                const now = Date.now();
                const key = `${String(item.id || '').trim()}::${column}::${text}`;
                const g = contentSendGuardRef.current || { ts: 0, key: '', busy: false };
                if (g.busy) return;
                if (g.key === key && now - Number(g.ts || 0) < 900) return;
                contentSendGuardRef.current = { ts: now, key, busy: true };
                try {
                    await Promise.resolve(onSend(text, { source: 'content-drawer', column }));
                } finally {
                    const latest = contentSendGuardRef.current || { ts: now, key, busy: true };
                    contentSendGuardRef.current = { ...latest, busy: false, ts: Date.now(), key };
                }
            };

            const refreshCategoryTabArrows = () => {
                const el = categoryTabsRef.current;
                if (!el) {
                    setTabArrows({ canScroll: false, canLeft: false, canRight: false });
                    return;
                }
                const { scrollLeft, scrollWidth, clientWidth } = el;
                const max = Math.max(0, scrollWidth - clientWidth);
                const canScroll = max > 2;
                setTabArrows({
                    canScroll,
                    canLeft: canScroll && scrollLeft > 2,
                    canRight: canScroll && scrollLeft < max - 2,
                });
            };

            const scrollCategoryTabs = (dir) => {
                const el = categoryTabsRef.current;
                if (!el) return;
                const step = Math.max(96, Math.floor(el.clientWidth * 0.5));
                el.scrollBy({ left: dir * step, behavior: 'smooth' });
            };

            useLayoutEffect(() => {
                refreshCategoryTabArrows();
                const el = categoryTabsRef.current;
                if (!el || !activeCategoryId) return;
                const chip = Array.from(el.querySelectorAll('[data-cat-tab]')).find(
                    (n) => n.getAttribute('data-cat-tab') === activeCategoryId,
                );
                if (chip && typeof chip.scrollIntoView === 'function') {
                    chip.scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
                requestAnimationFrame(() => refreshCategoryTabArrows());
            }, [data.categories, activeCategoryId]);

            useEffect(() => {
                const el = categoryTabsRef.current;
                if (!el) return undefined;
                const onScroll = () => refreshCategoryTabArrows();
                el.addEventListener('scroll', onScroll, { passive: true });
                const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => refreshCategoryTabArrows()) : null;
                if (ro) ro.observe(el);
                const onResize = () => refreshCategoryTabArrows();
                window.addEventListener('resize', onResize);
                let raf = requestAnimationFrame(() => refreshCategoryTabArrows());
                return () => {
                    el.removeEventListener('scroll', onScroll);
                    if (ro) ro.disconnect();
                    window.removeEventListener('resize', onResize);
                    cancelAnimationFrame(raf);
                };
            }, []);

            const showAlert = (message) => setAlertOpen({ show: true, message });
            const showConfirm = (message, onOk) => setConfirmOpen({ show: true, message, onOk });

            useEffect(() => {
                try {
                    const text = JSON.stringify(data);
                    writeMigratedStorage(CONTENT_MANAGER_STORAGE_KEY, text);
                } catch (_) {}
                if (!activeCategoryId && data.categories.length > 0) setActiveCategoryId(data.categories[0].id);
            }, [data, activeCategoryId]);

            const filteredRecords = useMemo(() => {
                let filtered = data.records.filter((r) => r.categoryId === activeCategoryId);
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    filtered = filtered.filter(
                        (r) =>
                            (r.titleZh && r.titleZh.toLowerCase().includes(q)) ||
                            (r.content && r.content.toLowerCase().includes(q)) ||
                            (r.contentZh && r.contentZh.toLowerCase().includes(q)),
                    );
                }
                return filtered;
            }, [data, activeCategoryId, searchQuery]);

            const canReorderRows = !searchQuery.trim();

            const reorderRecordsForCategory = (prev, catId, newOrderedForCategory) => {
                const cid = String(catId || '');
                const nextList = Array.isArray(newOrderedForCategory) ? newOrderedForCategory : [];
                const result = [];
                let inserted = false;
                for (const r of prev.records) {
                    if (r.categoryId === cid) {
                        if (!inserted) {
                            nextList.forEach((x) => result.push(x));
                            inserted = true;
                        }
                    } else {
                        result.push(r);
                    }
                }
                if (!inserted) {
                    nextList.forEach((x) => result.push(x));
                }
                return { ...prev, records: result };
            };

            const handleCopyRow = (content, itemId = '', e = null) => {
                e?.preventDefault?.();
                e?.stopPropagation?.();
                const text = String(content || '').trim();
                if (!text) return;
                const now = Date.now();
                const key = `${String(itemId || '').trim()}::${text}`;
                const guard = contentCopyGuardRef.current || { ts: 0, key: '' };
                if (guard.key === key && now - Number(guard.ts || 0) < 1200) return;
                contentCopyGuardRef.current = { ts: now, key };
                onCopy(text);
                showAlert(t('copySuccess'));
            };

            const handleDeleteRecord = (id) => {
                showConfirm(t('confirmDelContent'), () => setData((prev) => ({ ...prev, records: prev.records.filter((r) => r.id !== id) })));
            };
            const openDetail = (title, content) => {
                setDetailOpen({ show: true, title: title || t('content'), content: String(content || '').trim() || '-' });
            };

            const handleSaveRecord = (recordData) => {
                const { desc: _removed, ...rest } = recordData;
                const next = { ...rest };
                setData((prev) => {
                    if (next.id) return { ...prev, records: prev.records.map((r) => (r.id === next.id ? next : r)) };
                    return {
                        ...prev,
                        records: [{ ...next, id: generateId(), categoryId: activeCategoryId, date: new Date().toISOString().split('T')[0] }, ...prev.records],
                    };
                });
                setShowRecordModal(false);
            };

            const handleAddCategory = () => {
                const name = newCategoryName.trim();
                if (!name) return;
                const newCat = { id: generateId(), name };
                setData((prev) => ({ ...prev, categories: [...prev.categories, newCat] }));
                setActiveCategoryId(newCat.id);
                setNewCategoryName('');
            };

            const handleDeleteCategory = (id, e) => {
                e?.stopPropagation?.();
                showConfirm(t('confirmDelCategory'), () => {
                    setData((prev) => {
                        const categories = prev.categories.filter((c) => c.id !== id);
                        const records = prev.records.filter((r) => r.categoryId !== id);
                        setActiveCategoryId((cur) => (cur === id ? categories[0]?.id ?? null : cur));
                        return { categories, records };
                    });
                });
            };

            const getFirstSendTextForCategory = (catId) => {
                const row = data.records.find((r) => r.categoryId === catId);
                if (!row) return '';
                return String(row.content || row.contentZh || '').trim();
            };

            /**
             * 仅在「单击落在分类名区域」且「分类名一带仍有选区」时不切换，
             * 避免拖选后与单击切换混淆；点数角标/空白条仍可按单击切换。
             */
            const shouldSuppressCategoryTabActivateClick = (tabRootEl, clickTarget) => {
                const label = tabRootEl.querySelector?.('[data-category-tab-label]');
                if (!label || clickTarget == null) return false;
                if (!label.contains(clickTarget)) return false;
                const sel = window.getSelection?.();
                if (!sel || sel.rangeCount === 0) return false;
                if (!String(sel.toString()).trim()) return false;
                try {
                    const rng = sel.getRangeAt(0);
                    const ca = rng.commonAncestorContainer;
                    const el =
                        ca.nodeType === Node.ELEMENT_NODE ? ca : ca.parentElement;
                    return !!(el && typeof tabRootEl.contains === 'function' && tabRootEl.contains(el));
                } catch (_) {
                    return false;
                }
            };

            const handleCategoryTabDoubleClickSend = (catId, e) => {
                e.preventDefault();
                e.stopPropagation();
                try {
                    window.getSelection()?.removeAllRanges?.();
                } catch (_) {}
                const text = getFirstSendTextForCategory(catId);
                if (text) onSend(text);
                else showAlert(t('categoryTabNoScriptToSend'));
            };

            const handleCategoryDragStart = (e, index) => {
                setDraggedCategoryIdx(index);
                try {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', String(index));
                    fastgcSetMinimalDragImage(e.dataTransfer);
                } catch (_) {}
            };
            const handleCategoryDragOver = (e, index) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOverCategoryIdx(index);
            };
            const handleCategoryDrop = (e, dropIndex) => {
                e.preventDefault();
                e.stopPropagation();
                const from = draggedCategoryIdx;
                setDraggedCategoryIdx(null);
                setDragOverCategoryIdx(null);
                if (from === null || from === dropIndex) return;
                setData((prev) => {
                    const next = [...prev.categories];
                    const [moved] = next.splice(from, 1);
                    next.splice(dropIndex, 0, moved);
                    return { ...prev, categories: next };
                });
            };
            const handleCategoryDragEnd = () => {
                setDraggedCategoryIdx(null);
                setDragOverCategoryIdx(null);
            };

            const handleDragStart = (e, index) => {
                if (!canReorderRows) {
                    e.preventDefault();
                    return;
                }
                setDraggedIdx(index);
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', String(index));
                fastgcSetMinimalDragImage(e.dataTransfer);
            };
            const handleDragOver = (e, index) => {
                if (!canReorderRows) return;
                e.preventDefault();
                if (dragOverIdx !== index) setDragOverIdx(index);
            };
            const handleDrop = (e, index) => {
                e.preventDefault();
                if (!canReorderRows) {
                    setDraggedIdx(null);
                    setDragOverIdx(null);
                    return;
                }
                if (draggedIdx === null || draggedIdx === index) {
                    setDraggedIdx(null);
                    setDragOverIdx(null);
                    return;
                }
                const newFiltered = [...filteredRecords];
                const from = draggedIdx;
                const [moved] = newFiltered.splice(from, 1);
                const insertAt = from < index ? index - 1 : index;
                newFiltered.splice(insertAt, 0, moved);
                setData((prev) => reorderRecordsForCategory(prev, activeCategoryId, newFiltered));
                setDraggedIdx(null);
                setDragOverIdx(null);
            };

            return (
                <div className="h-full flex flex-col bg-slate-50 min-h-0 text-slate-800">
                    <div className="shrink-0 theme-primary-btn px-3 py-2 flex items-center justify-between gap-2 min-w-0">
                        <span className="font-bold text-[13px] text-white truncate min-w-0">{t('contentScriptTitle')}</span>
                        <div className="flex items-center gap-1.5 shrink-0">
                            <button
                                type="button"
                                onClick={() => {
                                    setNewCategoryName('');
                                    setShowCategoryModal(true);
                                }}
                                className="flex items-center gap-1 px-2.5 py-1 rounded-lg border border-white/40 text-white text-[11px] font-bold hover:bg-white/15 whitespace-nowrap"
                            >
                                <SVG.Plus c="w-3.5 h-3.5" /> {t('categoryManageTitle')}
                            </button>
                            <button type="button" onClick={onClose} className="p-1 rounded-lg hover:bg-white/20 text-white" aria-label={lang === 'zh' ? '关闭' : 'Close'}>
                                <SVG.XCircle c="w-5 h-5" />
                            </button>
                        </div>
                    </div>
                    <div className="shrink-0 bg-blue-600 border-b border-blue-700/30 flex flex-col">
                        <div className="flex items-center gap-0.5 px-1 py-1.5">
                            {tabArrows.canScroll ? (
                                <button
                                    type="button"
                                    onClick={() => scrollCategoryTabs(-1)}
                                    disabled={!tabArrows.canLeft}
                                    className={`shrink-0 w-7 h-8 flex items-center justify-center rounded-md text-white ${
                                        tabArrows.canLeft ? 'hover:bg-blue-700/90 active:bg-blue-800' : 'opacity-40 cursor-not-allowed'
                                    }`}
                                    aria-label={lang === 'zh' ? '分类向左' : 'Scroll categories left'}
                                >
                                    <SVG.ChevronLeft c="w-4 h-4" />
                                </button>
                            ) : null}
                            <div
                                ref={categoryTabsRef}
                                className="flex-1 min-w-0 overflow-x-auto flex items-center gap-2 py-0.5 px-0.5 no-scrollbar scroll-smooth"
                            >
                                {data.categories.map((cat, catIndex) => {
                                    const count = data.records.filter((r) => r.categoryId === cat.id).length;
                                    const isActive = activeCategoryId === cat.id;
                                    const isCatDragOver = dragOverCategoryIdx === catIndex;
                                    return (
                                        <div
                                            key={cat.id}
                                            data-cat-tab={cat.id}
                                            onClick={(e) => {
                                                if (shouldSuppressCategoryTabActivateClick(e.currentTarget, e.target)) return;
                                                setActiveCategoryId(cat.id);
                                            }}
                                            onDragOver={(e) => handleCategoryDragOver(e, catIndex)}
                                            onDrop={(e) => handleCategoryDrop(e, catIndex)}
                                            className={`group flex items-center gap-1 pl-1 pr-2 py-1.5 rounded-full cursor-pointer whitespace-nowrap border text-[11px] shrink-0 transition-all ${
                                                isActive ? 'bg-white border-white text-blue-600 shadow-sm' : 'bg-blue-700/50 border-transparent text-blue-100 hover:bg-blue-700'
                                            } ${draggedCategoryIdx === catIndex ? 'opacity-60' : ''} ${
                                                isCatDragOver ? 'ring-2 ring-white ring-offset-2 ring-offset-blue-600' : ''
                                            }`}
                                        >
                                            <span
                                                draggable
                                                onDragStart={(e) => handleCategoryDragStart(e, catIndex)}
                                                onDragEnd={handleCategoryDragEnd}
                                                onClick={(e) => e.stopPropagation()}
                                                className="cursor-grab active:cursor-grabbing select-none touch-none text-blue-300/90 hover:text-white shrink-0 p-0.5 rounded"
                                                title={t('categoryTabDragCatHint')}
                                            >
                                                <SVG.GripVertical c="w-3.5 h-3.5" />
                                            </span>
                                            <span
                                                data-category-tab-label
                                                className="font-bold max-w-[min(140px,28vw)] truncate select-text cursor-text"
                                                title={`${cat.name}\n${t('categoryTabNameInteractionHint')}`}
                                                onDoubleClick={(e) => handleCategoryTabDoubleClickSend(cat.id, e)}
                                            >
                                                {cat.name}
                                            </span>
                                            <span
                                                className={`text-[10px] px-1.5 py-0.5 rounded-full ${isActive ? 'bg-blue-100 text-blue-600 font-bold' : 'bg-blue-800/50 text-blue-200'}`}
                                            >
                                                {count}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>
                            {tabArrows.canScroll ? (
                                <button
                                    type="button"
                                    onClick={() => scrollCategoryTabs(1)}
                                    disabled={!tabArrows.canRight}
                                    className={`shrink-0 w-7 h-8 flex items-center justify-center rounded-md text-white ${
                                        tabArrows.canRight ? 'hover:bg-blue-700/90 active:bg-blue-800' : 'opacity-40 cursor-not-allowed'
                                    }`}
                                    aria-label={lang === 'zh' ? '分类向右' : 'Scroll categories right'}
                                >
                                    <SVG.ChevronRight c="w-4 h-4" />
                                </button>
                            ) : null}
                        </div>
                        <div className="px-2 pb-1.5 text-[9px] text-blue-100/85 leading-snug border-t border-blue-700/25">
                            {t('categoryTabDragCatHint')} · {t('categoryTabNameInteractionHint')} · {t('categoryManageTitle')}
                        </div>
                    </div>
                    <div className="shrink-0 bg-white px-2 py-2 border-b flex flex-col gap-2">
                        <div className="text-[10px] text-slate-500 flex items-center gap-1 flex-wrap">
                            <span className="bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold border border-blue-100">{t('hint')}</span>
                            <span>{t('totalPrefix')} <b>{filteredRecords.length}</b> {t('dragHint')}</span>
                        </div>
                        <div className="flex gap-2 items-stretch">
                            <div className="relative flex-1 min-w-0">
                                <SVG.Search c="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400 pointer-events-none" />
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder={t('searchContentPlaceholder')}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-lg pl-8 pr-2 py-1.5 text-[11px] outline-none focus:border-blue-400"
                                />
                            </div>
                            <button
                                type="button"
                                onClick={() => {
                                    setEditingRecord({ titleZh: '', titleEn: '', content: '', contentZh: '' });
                                    setShowRecordModal(true);
                                }}
                                className="shrink-0 theme-primary-btn px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1"
                            >
                                <SVG.Plus c="w-3.5 h-3.5" /> {t('addContent')}
                            </button>
                        </div>
                    </div>
                    <div className="flex-1 min-h-0 overflow-auto bg-white">
                        <table className="min-w-[540px] w-full text-left text-[11px] border-collapse table-fixed">
                            <thead className="bg-slate-50 sticky top-0 z-[1]">
                                <tr
                                    onDragOver={(e) => {
                                        if (!canReorderRows || filteredRecords.length === 0) return;
                                        e.preventDefault();
                                        if (dragOverIdx !== 0) setDragOverIdx(0);
                                    }}
                                    onDrop={(e) => {
                                        if (!canReorderRows || filteredRecords.length === 0) return;
                                        handleDrop(e, 0);
                                    }}
                                >
                                    <th className="px-1 py-1.5 font-semibold text-slate-500 w-9 text-center select-none" title={t('contentSortCol')}>
                                        {t('contentSortCol')}
                                    </th>
                                    <th className="px-2 py-1.5 font-semibold text-slate-500 w-[24%]">{t('zhTitle')}</th>
                                    <th className="px-2 py-1.5 font-semibold text-slate-500 w-[20%]">{t('enTitle')}</th>
                                    <th className="px-2 py-1.5 font-semibold text-slate-500 w-[16%]">{t('content')}</th>
                                    <th className="px-2 py-1.5 font-semibold text-slate-500 w-[16%]">{t('zhContent')}</th>
                                    <th className="px-2 py-1.5 font-semibold text-slate-500 text-right w-[20%]">{t('actions')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filteredRecords.length === 0 ? (
                                    <tr>
                                        <td colSpan="6" className="text-center py-12 text-slate-400 bg-slate-50/50">{t('emptyContent')}</td>
                                    </tr>
                                ) : (
                                    filteredRecords.map((item, index) => (
                                        <tr
                                            key={item.id}
                                            onDragOver={(e) => handleDragOver(e, index)}
                                            onDrop={(e) => handleDrop(e, index)}
                                            className={`drag-row border-t border-slate-100 ${draggedIdx === index ? 'opacity-40 bg-slate-50' : 'bg-white hover:bg-blue-50/40'} ${dragOverIdx === index && draggedIdx !== index ? 'border-t-2 border-t-blue-500 bg-blue-50/50' : ''}`}
                                        >
                                            <td
                                                className="px-1 py-1.5 align-middle text-center select-none"
                                                onClick={(e) => e.stopPropagation()}
                                                onDoubleClick={(e) => e.stopPropagation()}
                                            >
                                                <span
                                                    role="button"
                                                    tabIndex={0}
                                                    draggable={canReorderRows}
                                                    onDragStart={(e) => {
                                                        e.stopPropagation();
                                                        handleDragStart(e, index);
                                                    }}
                                                    onDragEnd={() => {
                                                        setDraggedIdx(null);
                                                        setDragOverIdx(null);
                                                    }}
                                                    onMouseDown={(e) => e.stopPropagation()}
                                                    title={canReorderRows ? (lang === 'zh' ? '拖动排序' : 'Drag to reorder') : lang === 'zh' ? '清空搜索后可排序' : 'Clear search to reorder'}
                                                    className={`inline-flex items-center justify-center w-7 h-8 rounded-md border border-transparent select-none touch-none ${
                                                        canReorderRows
                                                            ? 'cursor-grab active:cursor-grabbing text-slate-400 hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50/60'
                                                            : 'cursor-not-allowed text-slate-300 opacity-60'
                                                    }`}
                                                    aria-label={t('contentSortCol')}
                                                >
                                                    <SVG.GripVertical c="w-4 h-4" />
                                                </span>
                                            </td>
                                            <td className="px-2 py-1.5 align-middle min-w-0">
                                                <div
                                                    className="font-bold text-slate-900 leading-tight cursor-pointer truncate"
                                                    title={`${String(item.titleZh || '—').trim()} · ${lang === 'zh' ? '双击发送本条话术内容' : 'Double-click to send script body'}`}
                                                    onDoubleClick={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        sendContentRowQuick(item, 'zh-title');
                                                    }}
                                                >
                                                    {item.titleZh || '—'}
                                                </div>
                                            </td>
                                            <td className="px-2 py-1.5 align-middle min-w-0">
                                                <div
                                                    className="text-slate-500 leading-tight cursor-pointer truncate"
                                                    title={`${String(item.titleEn || '—').trim()} · ${lang === 'zh' ? '双击发送本条话术内容' : 'Double-click to send script body'}`}
                                                    onDoubleClick={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        sendContentRowQuick(item, 'en-title');
                                                    }}
                                                >
                                                    {item.titleEn || '—'}
                                                </div>
                                            </td>
                                            <td
                                                className="px-2 py-1.5 align-top"
                                                title={lang === 'zh' ? '双击仅发送「英文内容」正文（不回落中文）' : 'Double-click: send English body only (no Chinese fallback)'}
                                                onDoubleClick={(e) => {
                                                    e.preventDefault();
                                                    e.stopPropagation();
                                                    sendContentRowQuick(item, 'en-content');
                                                }}
                                            >
                                                <button
                                                    type="button"
                                                    onClick={() => openDetail(`${t('content')} · ${item.titleEn || item.titleZh || ''}`, item.content)}
                                                    className="text-blue-600 hover:text-blue-700 text-[11px] font-bold underline underline-offset-2"
                                                >
                                                    {t('viewDetail')}
                                                </button>
                                            </td>
                                            <td className="px-2 py-1.5 align-top">
                                                <button type="button" onClick={() => openDetail(`${t('zhContent')} · ${item.titleZh || item.titleEn || ''}`, item.contentZh)} className="text-blue-600 hover:text-blue-700 text-[11px] font-bold underline underline-offset-2">
                                                    {t('viewDetail')}
                                                </button>
                                            </td>
                                            <td className="px-2 py-1.5 text-right align-top">
                                                <div className="flex items-center justify-end gap-0.5">
                                                    <button
                                                        type="button"
                                                        onClick={(e) => handleCopyRow(item.content || '', item.id, e)}
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        onDoubleClick={(e) => {
                                                            e.preventDefault();
                                                            e.stopPropagation();
                                                        }}
                                                        className="p-1.5 text-slate-400 hover:text-blue-600 rounded-md"
                                                        title="copy"
                                                    >
                                                        <SVG.Copy c="w-3.5 h-3.5" />
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            setEditingRecord(item);
                                                            setShowRecordModal(true);
                                                        }}
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        onDoubleClick={(e) => e.stopPropagation()}
                                                        className="p-1.5 text-slate-400 hover:text-green-600 rounded-md"
                                                    >
                                                        <SVG.Edit c="w-3.5 h-3.5" />
                                                    </button>
                                                    <button
                                                        type="button"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleDeleteRecord(item.id);
                                                        }}
                                                        onMouseDown={(e) => e.stopPropagation()}
                                                        onDoubleClick={(e) => e.stopPropagation()}
                                                        className="p-1.5 text-slate-400 hover:text-red-600 rounded-md"
                                                    >
                                                        <SVG.Trash2 c="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {showRecordModal && editingRecord && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-3 bg-black/50 text-slate-800">
                            <div className="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
                                <div className="px-4 py-3 border-b flex justify-between items-center bg-slate-50 shrink-0">
                                    <h3 className="text-sm font-bold">{editingRecord.id ? t('editContent') : t('addContent')}</h3>
                                    <button type="button" onClick={() => setShowRecordModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <SVG.XCircle c="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto space-y-3 text-[12px]">
                                    <div className="grid grid-cols-1 gap-3">
                                        <div>
                                            <label className="block font-medium text-slate-600 mb-1">{t('zhTitle')}</label>
                                            <input value={editingRecord.titleZh} onChange={(e) => setEditingRecord({ ...editingRecord, titleZh: e.target.value })} className="w-full border rounded-lg px-2 py-1.5 outline-none focus:border-blue-500" placeholder={t('zhTitlePlaceholder')} />
                                        </div>
                                        <div>
                                            <label className="block font-medium text-slate-600 mb-1">{t('enTitleOptional')}</label>

                                        <textarea value={editingRecord.content} onChange={(e) => setEditingRecord({ ...editingRecord, content: e.target.value })} rows="4" className="w-full border rounded-lg px-2 py-1.5 outline-none resize-none focus:border-blue-500" placeholder={t('contentPlaceholder')} />
                                    </div>
                                    <div>
                                        <label className="block font-medium text-slate-600 mb-1">{t('zhContent')}</label>
                                        <textarea value={editingRecord.contentZh || ''} onChange={(e) => setEditingRecord({ ...editingRecord, contentZh: e.target.value })} rows="3" className="w-full border rounded-lg px-2 py-1.5 outline-none resize-none focus:border-blue-500" placeholder={lang === 'zh' ? '输入中文内容...' : 'Enter Chinese content...'} />
                                    </div>
                                </div>
                                <div className="px-4 py-3 border-t bg-slate-50 flex justify-end gap-2 shrink-0">
