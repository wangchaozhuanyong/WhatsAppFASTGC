                inboxMergeSuppressedUntilRef.current = Date.now() + 12000;
                localStorage.removeItem(GLOBAL_INBOX_KEY);
                localStorage.removeItem('fastgc_global_inbox_order');
                localStorage.removeItem(GLOBAL_INBOX_HIDDEN_MERGE_KEYS_KEY);
                writeCachedInbox([]);
                writeHiddenInboxMergeKeys(new Set());
                setGlobalInbox([]);
                setCurrentContactId('');
                setContextMenu(null);
                setWaSeatUnreadScan({});

                setInboxFilter('all');
            };

            const removeInboxRecord = (id) => {
                if (!id) return;
                if (!confirm(t('ctxDeleteConfirm'))) {
                    setContextMenu(null);
                    return;
                }
                const victim = (globalInboxRef.current || []).find((item) => item.id === id);
                if (victim) addHiddenInboxMergeKey(inboxMergeKey(victim));
                saveGlobalInbox((prev) => prev.filter((item) => item.id !== id));
                setCurrentContactId((old) => (old === id ? '' : old));
                setContextMenu(null);
            };

            const patchInboxRecord = (id, patch) => {
                saveGlobalInbox((prev) => prev.map((item) => item.id === id ? normalizeInboxRecord({ ...item, ...patch, timestamp: Date.now() }) : item));
            };
            const toggleFollowInboxRecord = (id, forcedValue) => {
                if (!id) return;
                saveGlobalInbox((prev) => prev.map((item) => {
                    if (item.id !== id) return item;
                    const nextFollowing = typeof forcedValue === 'boolean' ? forcedValue : !item.following;
                    return normalizeInboxRecord({ ...item, following: nextFollowing, timestamp: Date.now() });
                }));
                setContextMenu(null);
            };
            const openInboxContextMenu = (event, id) => {
                event.preventDefault();
                const menuWidth = 160;
                const menuHeight = 92;
                const padding = 10;
                const offsetX = 6;
                const offsetY = 4;
                let x = event.clientX + offsetX;
                let y = event.clientY + offsetY;
                if (x + menuWidth > window.innerWidth - padding) {
                    x = event.clientX - menuWidth - offsetX;
                }
                x = Math.max(padding, Math.min(window.innerWidth - menuWidth - padding, x));
                y = Math.max(padding, Math.min(window.innerHeight - menuHeight - padding, y));
                setContextMenu({ x, y, id });
            };
            const onInboxRowActivate = useCallback((record) => {
                const fn = inboxListActionsRef.current.openContactRecord;
                if (typeof fn === 'function') fn(record);
            }, []);
            const onInboxRowContextMenu = useCallback((e, id) => {
                const fn = inboxListActionsRef.current.openInboxContextMenu;
                if (typeof fn === 'function') fn(e, id);
            }, []);
            const onInboxRowTrash = useCallback((e, id) => {
                e.stopPropagation();
                const fn = inboxListActionsRef.current.removeInboxRecord;
                if (typeof fn === 'function') fn(id);
            }, []);
            const onInboxRowFollowToggle = useCallback((e, id, following) => {
                e.stopPropagation();
                const fn = inboxListActionsRef.current.patchInboxRecord;
                if (typeof fn === 'function') fn(id, { following: !following });
            }, []);

            /**
             * WhatsApp 当前会话「私聊号码」统一解析顺序（全项目唯一规则，sync / ensure / 注入前共用）：
             * 1) 群聊 → 不采号（isGroup）
             * 2) 快照内显式 phone
             * 3) 从 title / subtitle / chatKey 文本推导
             * 4) inbox 传入的兜底号码 recPhoneFallback（仅明确允许时）
             * 5) 本地缓存：头像 + 显示名（与侧栏/快照 profileName 一致）
             * 6) 本地缓存：chatKey（及 __d_ 号码指纹）
             */
            const unifiedResolvePrivatePhone = (snap, recPhoneFallback = '', opts = {}) => {
                const allowRecordFallback = opts?.allowRecordFallback !== false;
                const allowCache = opts?.allowCache !== false;
                const isGroup = Boolean(snap?.isGroup);
                const chatKey = String(snap?.chatKey || '').trim();
                const snapTitle = String(snap?.title || '').trim();
                const sideListTitle = String(snap?.sideListTitle || '').trim();
                const profileNameForCache =
                    sideListTitle || snapTitle || String(snap?.subtitle || '').trim() || chatKey;
                const profileSnapHint = { avatar: String(snap?.avatar || '').trim(), title: profileNameForCache };
                if (isGroup) {
                    return { isGroup: true, phone: '', chatKey, profileNameForCache, profileSnapHint };
                }
                let phone = normalizePhone(snap?.phone || '');
                let source = phone ? 'snapshot-phone' : '';
                if (!phone) {
                    phone =
                        derivePhoneFromLooseText(snap?.title) ||
                        derivePhoneFromLooseText(snap?.subtitle) ||
                        derivePhoneFromLooseText(chatKey);
                    if (phone) source = 'snapshot-text';
                }
                if (!phone && allowRecordFallback && isPlausibleWaPhone(recPhoneFallback)) {
                    phone = normalizePhone(recPhoneFallback);
                    source = 'record';
                }
                if (!isPlausibleWaPhone(phone)) phone = '';
                if (!phone && allowCache && chatKey) {
                    const cached = peekCachedPhoneForChatKey(chatKey);
                    if (cached && isPlausibleWaPhone(cached)) {
                        phone = cached;
                        source = 'chat-cache';
                    }
                }
                return {
                    isGroup: false,
                    phone: isPlausibleWaPhone(phone) ? normalizePhone(phone) : '',
                    source,
                    chatKey,
                    profileNameForCache,
                    profileSnapHint,
                };
            };

            const fetchWaActiveSnapshot = async (timeoutMs = 700) => {
                if (isActiveSeatPinned()) return null;
                const el = getActiveWebview();
                if (!el || typeof el.executeJavaScript !== 'function') return null;
                try {
                    const snap = await safeWebviewExecute(el, WA_ACTIVE_CHAT_SNAPSHOT_SCRIPT, true, timeoutMs);
                    if (!snap || snap.ok === false) return null;
                    return snap;
                } catch (_) {
                    return null;
                }
            };

            /** bypassTapCache：必须点头像右侧名称打开资料页采号时，勿因 chatKey/快照推导号码短路跳过注入脚本 */
            const collectPhoneFromActiveChat = async (opts = {}) => {
                if (waActiveCollectLockRef.current) return null;
                waActiveCollectLockRef.current = true;
                try {
                    const bypassTapCache = Boolean(opts && opts.bypassTapCache);
                    if (isActiveSeatPinned()) {
                        return null;
                    }
                    if (isCurrentGroupRef.current) {
                        return null;
                    }
                    const akCache = String(waActiveChatKeyRef.current || '').trim();
                    let hitPh = '';
                    let snapForMeta = null;
                    if (!bypassTapCache) {
                        hitPh = akCache ? peekCachedPhoneForChatKey(akCache) : '';
                        if (!isPlausibleWaPhone(hitPh)) {
                            snapForMeta = await fetchWaActiveSnapshot(700);
                            if (snapForMeta) {
                                const u = unifiedResolvePrivatePhone(snapForMeta, '');
                                if (!u.isGroup && isPlausibleWaPhone(u.phone)) hitPh = u.phone;
                            }
                        }
                        if (isPlausibleWaPhone(hitPh)) {
                            if (!snapForMeta) snapForMeta = await fetchWaActiveSnapshot(650);
                            const uMeta = snapForMeta ? unifiedResolvePrivatePhone(snapForMeta, hitPh) : null;
                            return {
                                ok: true,
                                phone: hitPh,
                                contactName: uMeta?.profileNameForCache || '',
                                avatar: uMeta?.profileSnapHint?.avatar || '',
                                fromCacheOnly: true,
                            };
                        }
                    }
                    const el = getActiveWebview();
                    if (!el || typeof el.executeJavaScript !== 'function') {
                        return null;
                    }
                    const result = await safeWebviewExecute(
                        el,
                        buildWaContactPhoneCollectScript(opts),
                        true,
                        1200,
                        9000,
                    );
                    return result || null;
                } catch (err) {
                    console.error('Phone collection error:', err);
                    return null;
                } finally {
                    waActiveCollectLockRef.current = false;
                }
            };

            const collectPhoneFromActiveSnapshot = async () => {
                const snap = await fetchWaActiveSnapshot(700);
                if (!snap) return null;
                const phone = normalizePhone(snap.phone || '');
                const contactName =
                    String(snap.sideListTitle || '').trim() || String(snap.title || snap.subtitle || '').trim();
                if (!phone && !contactName) return null;
                return { phone, contactName, avatar: String(snap.avatar || '').trim() };
            };

            const isWhatsAppComposeBusy = async () => {
                const el = getActiveWebview();
                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return false;
                try {
                    const result = await safeWebviewExecute(el, WA_COMPOSE_BUSY_SCRIPT, true);
                    return Boolean(result?.busy);
                } catch (_) {
                    return false;
                }
            };

            /** 最后交易：优先开放 API GET …/orders 按手机号分页取 created_at 最晚；失败再尝试订单管理页 DOM */

            /** snapshot / drawer / cache 等与 profileSource 比较的写入优先级（越大越强）；drawer > manual > snapshot-phone > … */
            const waPhoneCommitSourceRank = (src = '') => {
                const s = String(src || '').trim();
                if (s === 'drawer') return 400;
                if (s === 'manual') return 320;
                if (s === 'snapshot-phone') return 300;
                if (s === 'snapshot' || s === 'snapshot-text') return 200;
                if (s === 'profile-cache') return 150;
                if (s === 'chat-cache') return 120;
                return 100;
            };

            const getWaRowRequestToken = (contactId) => {
                const row = (globalInboxRef.current || []).find((x) => x.id === contactId);
                const t = row?.requestToken;
                return typeof t === 'number' && Number.isFinite(t) && t >= 0 ? t : 0;
            };

            /**
             * 不写「chatId≠则拒」锁；drawer 收束锁仅当 **行 chatId 与当前活跃会话一致** 时生效；
             * 弱来源不可压过更高优先级既有 profileSource。
             */
            const commitWaAllowsIncomingSource = (rowPrev, nextPhoneNorm, incomingSource, activeChatKeyNorm) => {
                const incoming = String(incomingSource || '').trim();
                const nextNorm = normalizePhone(nextPhoneNorm || '');
                const prevNorm = normalizePhone(rowPrev?.phone || '');
                /** drawer：允许 6+ 数字（上层已做 RAW 形状校验）；其它来源仍≥8 plausibility */
                if (incoming === 'drawer') {
                    return (
                        Boolean(nextNorm) &&
                        nextNorm.length >= 6 &&
                        !digitsLookLikeMillisTimestamp(nextNorm)
                    );
                }
                if (!isPlausibleWaPhone(nextNorm)) return false;
                if (!prevNorm || !isPlausibleWaPhone(prevNorm)) return true;
                if (prevNorm === nextNorm) return true;
                const rowCk = normalizeWaChatKey(rowPrev?.chatId || '');
                const act = String(activeChatKeyNorm || '').trim();
                /** 仅在「仍为该会话的行」上对 drawer 收束态加锁，避免切换会话后因旧 profileCollected 误锁 */
                const drawerFinal =
                    Boolean(rowPrev) &&
                    rowPrev.pendingCollect === false &&
                    rowPrev.profileCollected === true &&
                    !!rowCk &&
                    !!act &&
                    rowCk === act;
                const drawerTruth = rowCk && act && rowCk === act ? peekDrawerTruthPhoneForChatKey(rowCk) : '';
                const jidPhone = rowCk ? normalizePhone(phoneFromWaChatKey(rowCk) || '') : '';
                if (drawerTruth && isPlausibleWaPhone(jidPhone) && drawerTruth !== jidPhone) {
                    /** 真值与 chatKey(JID) 天然号码冲突，判为脏真值并清除，避免永久锁错号 */
                    waDebugLog('drawer_truth_drop_by_jid', { rowChatKey: rowCk, drawerTruth, jidPhone });
                    clearDrawerTruthPhoneForChatKey(rowCk);
                }
                if (drawerTruth && incoming !== 'drawer' && nextNorm !== drawerTruth) {
                    waDebugLog('commit_reject_drawer_truth', {
                        rowChatKey: rowCk,
                        incoming,
                        nextNorm,
                        truth: drawerTruth,
                    });
                    return false;
                }
                if (drawerFinal) return false;
                const prevRank = waPhoneCommitSourceRank(rowPrev.profileSource || '');
                const incRank = waPhoneCommitSourceRank(incoming);
                if (incRank < prevRank) return false;
                return true;
            };

            /** 号码已解析后的唯一写回入口：inbox + 本地缓存 + 采集状态 */
            const commitWaPhoneToInboxContact = (
                contactId,
                phoneRaw,
                chatKeyRaw,
                profileSnapHint,
                drawerExtras = null,
                source = '',
                commitMeta = null,
            ) => {
                const incomingSrc = String(source || '').trim();
                waDebugLog('commit_attempt', { contactId, source: incomingSrc });
                if (!contactId) return false;

                const rowPrev = (globalInboxRef.current || []).find((x) => x.id === contactId);
                const meta = commitMeta;
                if (
                    !meta ||
                    typeof meta.requestToken !== 'number' ||
                    !Number.isFinite(meta.requestToken)
                ) {
                    waDebugLog('commit_reject_token', { contactId, reason: 'missing_or_invalid_meta' });
                    return false;
                }

                /** 1）token —— 必须与行上一致，优先于 chatKey/plausibility 等任意放行（缺字段按 0 对齐 normalizeInboxRecord） */
                const rowTok =
                    typeof rowPrev?.requestToken === 'number' && Number.isFinite(rowPrev.requestToken)
                        ? rowPrev.requestToken
                        : 0;
                if (meta.requestToken !== rowTok) {
                    waDebugLog('commit_reject_token', {
                        contactId,
                        incomingTok: meta.requestToken,
                        rowTok,
                    });
                    return false;
                }

                const commitKey = normalizeWaChatKey(chatKeyRaw || waActiveChatKeyRef.current);
                const activeKeyNow = normalizeWaChatKey(waActiveChatKeyRef.current);
                /** 2）活跃会话 */
                if (commitKey && activeKeyNow && commitKey !== activeKeyNow) {
                    waDebugLog('commit_reject_active_key', {
                        contactId,
                        commitKey,
                        activeKeyNow,
                    });
                    return false;
                }

                const phone = normalizePhone(phoneRaw || '');
                const fromDrawer = incomingSrc === 'drawer';

                /** 3）抽屉：RAW + 最短数字规则；其余：整条 plausible */
                if (fromDrawer) {
                    if (!isWaCommitDrawerPhoneMinimal(phoneRaw)) {
                        waDebugLog('commit_reject_phone', { contactId, reason: 'drawer_shape_invalid' });
                        return false;
                    }
                } else if (!phone || !isPlausibleWaPhone(phone)) {
                    waDebugLog('commit_reject_phone', { contactId, reason: 'implausible_non_drawer' });
                    return false;
                }

                /** 4）同号不写 —— drawer / manual 例外；幂等返回 true，便于调用方走后续联系人同步分支 */
                const isManualSrc = incomingSrc === 'manual';
                if (
                    !fromDrawer &&
                    !isManualSrc &&
                    (() => {
                        const pp = normalizePhone(rowPrev?.phone || '');
                        return pp && pp === phone;
                    })()
                ) {
                    waDebugLog('commit_skip_same_phone', { contactId, phone, note: 'idempotent_ok' });
                    return true;
                }

                /** 5）来源优先级 / 收束锁 */
                if (!commitWaAllowsIncomingSource(rowPrev, phone, incomingSrc, activeKeyNow)) {
                    waDebugLog('commit_reject_rank', { contactId, source: incomingSrc });
                    return false;
                }

                waDebugLog('commit_success', { contactId, source: incomingSrc, phoneDigits: phone.length });
                const patch = {
                    phone,
                    chatId: commitKey,
                    profileCollected: fromDrawer,
                    profileSource: fromDrawer ? 'drawer' : incomingSrc || null,
                    /** 只有 drawer 才算采集结束；其它来源始终把行留在可纠正状态 */
                    pendingCollect: !fromDrawer,
                    synced: true,
                };
                if (drawerExtras) {
                    const dn = String(drawerExtras.name || '').trim();
                    const dav = String(drawerExtras.avatar || '').trim();
                    if (dn) patch.name = dn;
                    if (dav) patch.avatar = dav;
                }
                patchInboxRecord(contactId, patch);
                const baseHint =
                    profileSnapHint && String(profileSnapHint.title || profileSnapHint.displayName || '').trim()
                        ? profileSnapHint
                        : null;
                const mergedHint = baseHint
                    ? {
                        avatar: String((drawerExtras && drawerExtras.avatar) || baseHint.avatar || '').trim(),
                        title: String(
                            (drawerExtras && drawerExtras.name) || baseHint.title || baseHint.displayName || '',
                        ).trim(),
                    }
                    : drawerExtras && (drawerExtras.name || drawerExtras.avatar)
                      ? {
                            avatar: String(drawerExtras.avatar || '').trim(),
                            title: String(drawerExtras.name || '').trim(),
                        }
                      : null;
                rememberWaPhoneForChatKey(
                    chatKeyRaw || waActiveChatKeyRef.current,
                    phone,
                    mergedHint && (mergedHint.title || mergedHint.avatar) ? mergedHint : baseHint,
                );
                if (fromDrawer) markDrawerTruthPhoneForChatKey(commitKey || chatKeyRaw || waActiveChatKeyRef.current, phone);

                return true;
            };

            /**
             * 用户在 **WA webview 内** 打开「联系人信息」抽屉时：在嵌入页只读抽屉里的号码，与 **当前联系人对应的全局汇聚记录（latestSame.phone）及号码缓存** 比对，不一致则写回。
             * 「全局消息汇聚」仅指 **列表里的数据行**（cid / patchInboxRecord），不是宿主左侧 🌐 那块面板的 DOM；读号脚本只在 webview 里执行。
             */
            const reconcileOpenDrawerPhoneWithInbox = async (cid, chatKey, snap, latestSame) => {
                if (!cid || isActiveSeatPinned() || isCurrentGroupRef.current) return false;
                const el = getActiveWebview();
                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return false;
                const ckNorm = normalizeWaChatKey(String(chatKey || ''));
                if (ckNorm.length < 2) return false;
                const t = Date.now();
                const last = waDrawerPhoneReconcileLastAtRef.current[ckNorm] || 0;
                if (t - last < 160) return false;
                try {
                    const raw = await safeWebviewExecute(
                        el,
                        buildWaContactPhoneCollectScript({ readOpenDrawerOnly: true }),
                        true,
                        900,
                        7500,
                    );
                    waDrawerPhoneReconcileLastAtRef.current[ckNorm] = Date.now();
                    if (raw && raw.readOpenDrawerOnly && (raw.reason === 'no-drawer' || raw.reason === 'not-contact-drawer')) {
                        waDrawerPhoneReconcileLastAtRef.current[ckNorm] = Date.now() - 340;
                    }
                    if (!raw || !raw.readOpenDrawerOnly || !raw.ok || !isPlausibleWaPhone(raw.phone)) return false;
                    const drawerPhone = normalizePhone(raw.phone);
                    const rowPhone = normalizePhone((latestSame && latestSame.phone) || '');
                    const cachePhone = normalizePhone(peekCachedPhoneForChatKey(chatKey) || '');
                    if (rowPhone && rowPhone === drawerPhone) {
                        if (!cachePhone || cachePhone !== drawerPhone) {
                            const snapTitle = String(snap?.title || '').trim();
                            const sideListTitle = String(snap?.sideListTitle || '').trim();
                            const profileNameForCache =
                                sideListTitle || snapTitle || String(snap?.subtitle || '').trim() || String(snap?.chatKey || '').trim();
                            rememberWaPhoneForChatKey(chatKey, drawerPhone, {
                                avatar: String(snap?.avatar || '').trim(),
                                title: profileNameForCache,
                            });
                        }
                        return false;
                    }
                    const snapTitle = String(snap?.title || '').trim();
                    const sideListTitle = String(snap?.sideListTitle || '').trim();
                    const profileNameForCache =
                        sideListTitle || snapTitle || String(snap?.subtitle || '').trim() || String(snap?.chatKey || '').trim();
                    const profileSnapHint = { avatar: String(snap?.avatar || '').trim(), title: profileNameForCache };
                    const dName = String(raw.contactName || raw.beforeTitle || '').trim();
                    const dAv = String(raw.avatar || '').trim();
                    commitWaPhoneToInboxContact(
                        cid,
                        drawerPhone,
                        chatKey,
                        profileSnapHint,
                        {
                            name: dName || profileNameForCache,
                            avatar: dAv || profileSnapHint.avatar,
                        },
                        'drawer',
                        { requestToken: getWaRowRequestToken(cid) },
                    );
                    return true;
                } catch (_) {
                    return false;
                }
            };

            const invalidateWaPhoneCacheForChatSession = (chatKeyRaw, item, profileSnapHint) => {
                const ck = normalizeWaChatKey(chatKeyRaw);
                const oldPh = normalizePhone(item?.phone || '');
                const purgeKey = (k) => {
                    const s = String(k || '');
                    if (!s) return;
                    waDrawerPhoneDoneRef.current.delete(s);
                    waPhoneVerifiedAtRef.current.delete(s);
                };
                waDrawerDoneKeyVariants(chatKeyRaw, oldPh).forEach(purgeKey);
                if (ck.length >= 2) {
                    waPhoneByChatKeyRef.current.delete(ck);
                    purgeKey(ck);
                    clearDrawerTruthPhoneForChatKey(ck);
                }
                const ckDigs = String(chatKeyRaw || '').replace(/\D/g, '');
                if (ckDigs.length >= 8) {
                    waPhoneByChatKeyRef.current.delete('__d_' + ckDigs);
                    purgeKey('__d_' + ckDigs);
                }
                const oldDigs = oldPh.replace(/\D/g, '');
                if (oldDigs.length >= 8) {
                    waPhoneByChatKeyRef.current.delete('__d_' + oldDigs);
                    purgeKey('__d_' + oldDigs);
                }
                const ht = String(
                    (profileSnapHint && (profileSnapHint.title || profileSnapHint.displayName)) ||
                        item?.name ||
                        item?.sourceChat ||
                        '',
                ).trim();
                waProfilePhoneKeys((profileSnapHint && profileSnapHint.avatar) || item?.avatar, ht).forEach((pk) => {
                    waDrawerPhoneDoneRef.current.delete(pk);
                    waPhoneByChatKeyRef.current.delete(pk);
                    waPhoneVerifiedAtRef.current.delete(pk);
                });
                persistWaDrawerPhoneDoneSet(waDrawerPhoneDoneRef.current);
                persistWaPhoneChatKeyMap(waPhoneByChatKeyRef.current);
                persistWaPhoneVerifiedAtMap(waPhoneVerifiedAtRef.current);
            };

            const isWaPhoneVerificationStale = (chatKeyRaw, item, profileHint) => {
                const keys = [];
                const add = (k) => {
                    const s = String(k || '');
                    if (s && keys.indexOf(s) === -1) keys.push(s);
                };
                const ck = normalizeWaChatKey(chatKeyRaw);
                if (ck.length >= 2) add(ck);
                waDrawerDoneKeyVariants(chatKeyRaw, item?.phone || '').forEach(add);
                if (profileHint) {
                    const t = String(profileHint.title || profileHint.displayName || '').trim();
                    waProfilePhoneKeys(profileHint.avatar, t).forEach(add);
                }
                let latest = 0;
                for (const k of keys) {
                    const v = waPhoneVerifiedAtRef.current.get(k);
                    if (typeof v === 'number' && v > latest) latest = v;
                }
                if (!latest) return true;
                return Date.now() - latest > WA_PHONE_VERIFY_TTL_MS;
            };

            /** 与当前 WA 快照比对 + 48h TTL：错号/过期则失效缓存并走重新采号 */
            const resolvePhoneCollectShortCircuit = (item, snapReuse, activeKey) => {
                const inboxPh = isPlausibleWaPhone(item.phone) ? normalizePhone(item.phone) : '';
                if (!inboxPh) {
                    waDebugLog('short_circuit', {
                        contactId: item?.id || '',
                        action: 'continue',
                        reason: 'no_inbox_phone',
                    });
                    return { action: 'continue' };
                }
                const u = snapReuse ? unifiedResolvePrivatePhone(snapReuse, '', { allowRecordFallback: false, allowCache: false }) : null;
                const snapPhFromUnified = u && !u.isGroup && isPlausibleWaPhone(u.phone) ? normalizePhone(u.phone) : '';
                const snapPhFromLoose =
                    normalizePhone(
                        derivePhoneFromLooseText(
                            [
                                String(snapReuse?.title || '').trim(),
                                String(snapReuse?.subtitle || '').trim(),
                                String(snapReuse?.sideListTitle || '').trim(),
                            ]
                                .filter(Boolean)
                                .join('\n'),
                        ),
                    ) ||
                    normalizePhone(phoneFromWaChatKey(normalizeWaChatKey(activeKey || snapReuse?.chatKey || '')) || '') ||
                    normalizePhone(derivePhoneFromLooseText(String(activeKey || snapReuse?.chatKey || '').trim()));
                const snapPh =
                    (isPlausibleWaPhone(snapPhFromUnified) ? normalizePhone(snapPhFromUnified) : '') ||
                    (isPlausibleWaPhone(snapPhFromLoose) ? normalizePhone(snapPhFromLoose) : '');
                const cachePhRaw = peekCachedPhoneForChatKey(activeKey);
                const cachePh = isPlausibleWaPhone(cachePhRaw) ? normalizePhone(cachePhRaw) : '';
                const liveMismatch =
                    (snapPh && inboxPh && snapPh !== inboxPh) || (snapPh && cachePh && snapPh !== cachePh);
                const stale = isWaPhoneVerificationStale(activeKey, item, u?.profileSnapHint);
                const baseMeta = {
                    contactId: item?.id || '',
                    activeKey: normalizeWaChatKey(activeKey || ''),
                    inboxPh,
                    snapPh,
                    cachePh,
                    liveMismatch,
                    stale,
                    profileCollected: Boolean(item?.profileCollected),
                };
                if (item.profileCollected) {
                    if (!liveMismatch && !stale) {
                        waDebugLog('short_circuit', { ...baseMeta, action: 'done', reason: 'stable_verified_profile_collected' });
                        return { action: 'done' };
                    }
                    if (!liveMismatch && stale && snapPh && snapPh === inboxPh) {
                        touchWaPhoneVerifiedAt(activeKey, inboxPh, u.profileSnapHint);
                        waDebugLog('short_circuit', { ...baseMeta, action: 'done', reason: 'refresh_ttl_profile_collected' });
                        return { action: 'done' };
                    }
                    if (liveMismatch && snapPh) {
                        invalidateWaPhoneCacheForChatSession(activeKey, item, u.profileSnapHint);
                        waDebugLog('short_circuit', { ...baseMeta, action: 'commit_snap', reason: 'live_mismatch_with_snap' });
                        return { action: 'commit_snap', snapPh, hint: u.profileSnapHint, source: u.source || 'snapshot' };
                    }
                    invalidateWaPhoneCacheForChatSession(activeKey, item, u?.profileSnapHint);
                    patchInboxRecord(item.id, { profileCollected: false });
                    waDebugLog('short_circuit', { ...baseMeta, action: 'collect', reason: 'profile_collected_but_no_resolvable_snap' });
                    return { action: 'collect' };
                }
                if (!liveMismatch && !stale) {
                    waDebugLog('short_circuit', { ...baseMeta, action: 'done', reason: 'stable_not_collected' });
                    return { action: 'done' };
                }
                if (!liveMismatch && stale && snapPh && snapPh === inboxPh) {
                    touchWaPhoneVerifiedAt(activeKey, inboxPh, u.profileSnapHint);
                    patchInboxRecord(item.id, { profileCollected: true, synced: true });
                    waDebugLog('short_circuit', { ...baseMeta, action: 'done', reason: 'refresh_ttl_and_mark_collected' });
                    return { action: 'done' };
                }
                if (liveMismatch && snapPh) {
                    invalidateWaPhoneCacheForChatSession(activeKey, item, u.profileSnapHint);
                    waDebugLog('short_circuit', { ...baseMeta, action: 'commit_snap', reason: 'live_mismatch_with_snap' });
                    return { action: 'commit_snap', snapPh, hint: u.profileSnapHint, source: u.source || 'snapshot' };
                }
                invalidateWaPhoneCacheForChatSession(activeKey, item, u?.profileSnapHint);
                waDebugLog('short_circuit', { ...baseMeta, action: 'collect', reason: 'fallback_collect' });
                return { action: 'collect' };
            };

            /** 独立采号执行器：统一封装 snapshot -> drawer(readonly/active) -> 文本兜底，返回结构化结果 */
            const runIndependentPhoneCollector = async (params = {}) => {
                const item = normalizeInboxRecord(params.item || {});
                const drawerOnly = Boolean(params.drawerOnly);
                const activeKey = String(params.activeKey || waActiveChatKeyRef.current || '');
                const activeKeyNorm = normalizeWaChatKey(String(params.activeKeyNorm || activeKey));
                let snapReuse = params.snapReuse || null;
                const hasPhone = (v) => !!normalizePhone(v || '');
                const isChatSwitched = () =>
                    activeKeyNorm && normalizeWaChatKey(waActiveChatKeyRef.current) !== activeKeyNorm;
                waDebugLog('collector_start', {
                    contactId: item.id || '',
                    drawerOnly,
                    activeKey: activeKeyNorm,
                });

                let result = null;
                if (!drawerOnly) {
                    const snap = snapReuse || (await fetchWaActiveSnapshot(900));
                    if (snap) snapReuse = snap;
                    if (snap) {
                        const u = unifiedResolvePrivatePhone(snap, '', { allowRecordFallback: false, allowCache: false });
                        const phoneEff = isPlausibleWaPhone(u.phone) ? u.phone : normalizePhone(snap.phone || '');
                        const contactName =
                            u.profileNameForCache ||
                            String(snap.sideListTitle || '').trim() ||
                            String(snap.title || snap.subtitle || '').trim();
                        result = { phone: phoneEff, contactName, avatar: String(snap.avatar || '').trim(), accountType: 'personal' };
                    }
                }
                if (isChatSwitched()) {
                    waDebugLog('collector_done', { contactId: item.id || '', status: 'aborted', reason: 'chat_switched', phase: 'after_snapshot' });
                    return { status: 'aborted', reason: 'chat_switched', phase: 'after_snapshot', snapReuse };
                }

                if (!hasPhone(result?.phone || '')) {
                    const composeBusy = await isWhatsAppComposeBusy();
                    if (composeBusy) {
                        waDebugLog('collector_done', { contactId: item.id || '', status: 'compose_busy' });
                        return { status: 'compose_busy', snapReuse };
                    }
                }
                if (isChatSwitched()) {
                    waDebugLog('collector_done', { contactId: item.id || '', status: 'aborted', reason: 'chat_switched', phase: 'after_compose_busy' });
                    return { status: 'aborted', reason: 'chat_switched', phase: 'after_compose_busy', snapReuse };
                }

                if (!hasPhone(result?.phone || '')) {
                    result = await collectPhoneFromActiveChat({
                        bypassTapCache: true,
                        readOpenDrawerOnly: drawerOnly,
                    });
                }
                /**
                 * 关键：drawerOnly 模式仅做“已打开抽屉只读对账”，禁止回退到主动开抽屉。
                 * 否则会出现：抽屉 DOM 变化 -> chat-dirty -> 触发采集 -> 主动开/关抽屉 -> 再次 chat-dirty 的循环。
                 */
                if (isChatSwitched()) {
                    waDebugLog('collector_done', { contactId: item.id || '', status: 'aborted', reason: 'chat_switched', phase: 'after_inject' });
                    return { status: 'aborted', reason: 'chat_switched', phase: 'after_inject', snapReuse };
                }

                if (result && result.aborted) {
                    waDebugLog('collector_done', { contactId: item.id || '', status: 'aborted', reason: 'collector_aborted' });
                    return { status: 'aborted', reason: 'collector_aborted', snapReuse };
                }

                if (!hasPhone(result?.phone || '')) {
                    const keyNow = String(waActiveChatKeyRef.current || activeKey || '').trim();
                    const keyNormNow = normalizeWaChatKey(keyNow);
                    const fallbackNoJsPhone =
                        normalizePhone(phoneFromWaChatKey(keyNormNow) || '') ||
                        derivePhoneFromLooseText(keyNow) ||
                        derivePhoneFromLooseText(item.sourceChat) ||
                        derivePhoneFromLooseText(item.name);
                    if (isPlausibleWaPhone(fallbackNoJsPhone)) {
                        waDebugLog('collect_fallback_phone_no_js', {
                            contactId: item.id,
                            from: keyNormNow ? 'chat_key' : 'loose_text',
                        });
                        result = {
                            ok: true,
                            phone: fallbackNoJsPhone,
                            contactName: String(item.name || item.sourceChat || '').trim(),
                            avatar: '',
                            accountType: 'personal',
                            fallbackNoJs: true,
                        };
                    } else {
                        waDebugLog('collector_done', { contactId: item.id || '', status: 'no_js_result' });
                        return { status: 'no_js_result', snapReuse };
                    }
                }

                waDebugLog('collector_done', {
                    contactId: item.id || '',
                    status: 'ok',
                    phone: normalizePhone(result?.phone || ''),
                    source: String(
                        result?.fromOpenDrawer || result?.panelOpened
                            ? 'drawer'
                            : result?.fromWppPnLid
                              ? 'wpp-pnlid'
                              : 'snapshot',
                    ),
                });
                return { status: 'ok', result, snapReuse };
            };

            const ensureContactProfileCollected = async (record, options = {}) => {
                const item = normalizeInboxRecord(record || {});
                const retry = Number(options.retry || 0);
                const maxRetry = Number(options.maxRetry || 4);
                const drawerOnly = Boolean(options.drawerOnly);
                if (!item.id) return;
                if (item.isGroup) {
                    patchInboxRecord(item.id, { isGroup: true, profileCollected: false, phone: '', collected: true, synced: true });

                    return;
                }
                if (isActiveSeatPinned()) {

                    return;
                }
                if (isCurrentGroupRef.current) {
                    patchInboxRecord(item.id, { isGroup: true, profileCollected: false, phone: '', collected: true, synced: true });

                    return;
                }
                const activeKey = waActiveChatKeyRef.current;
                const activeKeyNorm = normalizeWaChatKey(activeKey);
                /** compose_busy / no_js 等重试时带上快照，少打一次 fetchWaActiveSnapshot */
                let snapReuse = options.snapReuse != null ? options.snapReuse : null;
                if (profileCollectingRef.current.has(item.id)) return;
                profileCollectingRef.current.add(item.id);

                try {
                    const collectRun = await runIndependentPhoneCollector({
                        item,
                        drawerOnly,
                        activeKey,
                        activeKeyNorm,
                        snapReuse,
                    });
                    if (collectRun && collectRun.snapReuse) snapReuse = collectRun.snapReuse;
                    if (collectRun.status === 'aborted') {
                        if (collectRun.reason === 'chat_switched') {
                            waDebugLog('collect_aborted_by_chat_switch', { contactId: item.id, phase: collectRun.phase || 'unknown' });

                        } else {

                        }
                        return;
                    }
                    if (collectRun.status === 'compose_busy') {
                        if (retry >= maxRetry) {

                            return;
                        }

                        const snapForRetry = collectRun.snapReuse || snapReuse;
                        const busyRetryMs = retry === 0 ? 2200 : 1200;
                        setTimeout(() => {
                            ensureContactProfileCollected(item, {
                                retry: retry + 1,
                                maxRetry,
                                drawerOnly,
                                snapReuse: snapForRetry,
                            });
                        }, busyRetryMs);
                        return;
                    }
                    if (collectRun.status === 'no_js_result') {
                        if (retry >= maxRetry) {
                            markWaChatBindingPending(activeKey || waActiveChatKeyRef.current, item.name || item.sourceChat || '', 'profile-panel');

                        }
                        else {

                            setTimeout(() => {
                                ensureContactProfileCollected(item, { retry: retry + 1, maxRetry, drawerOnly });
                            }, 1100);
                        }
                        return;
                    }
                    const result = collectRun.result || null;
                    let nextPhone = normalizePhone(result.phone || '') || (isPlausibleWaPhone(item.phone) ? normalizePhone(item.phone) : '');
                    let nextName = String(result.contactName || result.beforeTitle || '').trim() || item.name;
                    const nextAvatar = String(result.avatar || '').trim();
                    const phoneSource = (result.fromOpenDrawer || result.panelOpened)
                        ? 'drawer'
                        : result.fromWppPnLid
                          ? 'snapshot-phone'
                          : 'snapshot';
                    if (activeKeyNorm && normalizeWaChatKey(waActiveChatKeyRef.current) !== activeKeyNorm) {
                        waDebugLog('collect_aborted_by_chat_switch', { contactId: item.id, phase: 'before_commit' });

                        return;
                    }
                    if (!nextPhone) {
                        nextPhone =
                            derivePhoneFromLooseText(nextName) ||
                            derivePhoneFromLooseText(item.name) ||
                            derivePhoneFromLooseText(item.sourceChat) ||
                            derivePhoneFromLooseText(waActiveChatKeyRef.current);
                    }
                    const phoneFromActiveChatKey = normalizePhone(phoneFromWaChatKey(activeKeyNorm) || '');
                    if (
                        !drawerOnly &&
                        phoneSource !== 'drawer' &&
                        isPlausibleWaPhone(nextPhone) &&
                        isPlausibleWaPhone(phoneFromActiveChatKey) &&
                        nextPhone !== phoneFromActiveChatKey
                    ) {
                        waDebugLog('collect_guard_chatkey_mismatch', {
                            contactId: item.id,
                            nextPhone,
                            phoneFromActiveChatKey,
                            activeKey: activeKeyNorm,
                        });
                        invalidateWaPhoneCacheForChatSession(activeKeyNorm, item, {
                            avatar: nextAvatar,
                            title: nextName || String(item.sourceChat || '').trim(),
                        });
                        nextPhone = '';
                    }
                    if (!nextPhone && !nextName) {
                        if (retry >= maxRetry) {
                            markWaChatBindingPending(activeKey || waActiveChatKeyRef.current, item.name || item.sourceChat || '', 'profile-panel');

                        }
                        else {

                            setTimeout(() => {
                                ensureContactProfileCollected(item, { retry: retry + 1, maxRetry, drawerOnly });
                            }, 1100);
                        }
                        return;
                    }
                    if (nextPhone) {
                        const ckRem = waActiveChatKeyRef.current || item.sourceChat || item.name || nextName;
                        const ok = commitWaPhoneToInboxContact(
                            item.id,
                            nextPhone,
                            ckRem,
                            {
                                avatar: nextAvatar,
                                title: nextName || String(item.sourceChat || '').trim() || ckRem,
                                accountType: result.accountType === 'business' ? 'business' : 'personal',
                                source: phoneSource,
                            },
                            { name: nextName, avatar: nextAvatar },
                            phoneSource,
                            { requestToken: getWaRowRequestToken(item.id) },
                        );
                        if (ok) {

                        } else {
                            /**
                             * 单写入通道：禁止 commit 失败后直写 patch（会绕过来源优先级/会话锁，导致抽屉正确号被弱来源覆盖）。
                             * 失败统一标记为 rejected，后续仅允许通过 commitWaPhoneToInboxContact 重试。
                             */

                        }
                    } else if (retry >= maxRetry) {
                        markWaChatBindingPending(activeKey || waActiveChatKeyRef.current, item.name || item.sourceChat || '', 'profile-panel');

                    } else {

                        setTimeout(() => {
                            ensureContactProfileCollected(item, { retry: retry + 1, maxRetry, drawerOnly });
                        }, 1200);
                    }
                } catch (err) {
                    console.error('ensureContactProfileCollected', err);

                } finally {
                    profileCollectingRef.current.delete(item.id);
                }
            };

            const upsertFromActiveChatSnapshot = (snapshot = {}) => {
                const layoutNow = seatLayoutRef.current;
                const pinSeat = String(layoutNow.pinnedSeatId || '');
                const activeSeatNow = String(layoutNow.activeSeatId || '1');
                // 固定席位：侧栏批量 merge 仍由 collectCurrentSeat 跳过；当前会话快照也不写入汇聚（且不采号，见 sync 提前 return）。
                if (pinSeat && activeSeatNow === pinSeat) return null;
                const title = String(snapshot.title || '').trim();
                const chatId = normalizeWaChatKey(snapshot.chatKey || '');
                const rawPhone =
                    normalizePhone(snapshot.phone || '') ||
                    derivePhoneFromLooseText(snapshot.title) ||
                    derivePhoneFromLooseText(snapshot.subtitle) ||
                    phoneFromWaChatKey(chatId) ||
                    derivePhoneFromLooseText(snapshot.chatKey);
                const isGr = Boolean(snapshot.isGroup) || isWaGroupChatKey(chatId);
                const phone = isGr ? '' : rawPhone;
                const snapAvatar = String(snapshot.avatar || '').trim();
                if (!chatId && !title && !phone) return null;
                const seatId = activeSeatNow;
                const inbox = globalInboxRef.current || [];
                const byChatId = chatId
                    ? inbox.find((item) => normalizeWaChatKey(item.chatId || '') === chatId && String(item.seatId || '') === seatId)
                    : null;
                const sameTitle = (item) => normalizeWaChatKey(item.sourceChat || item.name || '') === normalizeWaChatKey(title);
                const sameAvatar = (item) => {
                    const a = normalizeWaAvatarSig(item?.avatar || '');
                    const b = normalizeWaAvatarSig(snapAvatar || '');
                    return Boolean(snapAvatar && item?.avatar && a !== '_' && b !== '_' && a === b);
                };
                const byName = !byChatId && title
                    ? inbox.find((item) => sameTitle(item) && String(item.seatId || '') === seatId)
                    : null;
                const byPhone = !byChatId && !byName && phone
                    ? inbox.find((item) => {
                        if (normalizePhone(item.phone || '') !== phone) return false;
                        if (!title) return true;
                        return sameTitle(item) || sameAvatar(item);
                    })
                    : null;
                const matched = byChatId || byName || byPhone || null;
                if (matched) {
                    const prevChatNorm = normalizeWaChatKey(matched.chatId || '');
                    const nextChatNorm = normalizeWaChatKey(chatId || '');
                    const chatSwappedOntoRow =
                        !isGr &&
                        prevChatNorm.length >= 2 &&
                        nextChatNorm.length >= 2 &&
                        prevChatNorm !== nextChatNorm;
                    const snapPhNorm = !isGr && isPlausibleWaPhone(normalizePhone(phone || '')) ? normalizePhone(phone || '') : '';
                    const matchedPhNorm =
                        !isGr && isPlausibleWaPhone(matched.phone || '') ? normalizePhone(matched.phone || '') : '';
                    const drawerFinalized =
                        !isGr &&
                        Boolean(matched?.profileCollected) &&
                        String(matched?.profileSource || '') === 'drawer' &&
                        matched?.pendingCollect === false &&
                        prevChatNorm.length >= 2 &&
                        nextChatNorm.length >= 2 &&
                        prevChatNorm === nextChatNorm;
                    /** 当前会话 JID 可反解的号码：用于识别「行上残留错号」 */
                    const jidPhNorm =
                        !isGr && nextChatNorm.length >= 2
                            ? normalizePhone(phoneFromWaChatKey(nextChatNorm) || '')
                            : '';
                    const jidPlausible = isPlausibleWaPhone(jidPhNorm);
                    const rowDisagreesWithJid =
                        jidPlausible && matchedPhNorm && matchedPhNorm !== jidPhNorm;
                    /**
                     * 单通道改号原则：
                     * - 抽屉已收束（drawer_finalized）后，快照上来的号码不得直接 patch 覆盖。
                     * - 允许 chatSwapped 场景按新会话重建号码。
                     * - 非收束：若行上号码与 JID 反解不一致，必须以 JID/快照纠偏（否则错缓存会永远盖住真号）。
                     */
                    let mergedPhone = '';
                    if (isGr) mergedPhone = '';
                    else if (chatSwappedOntoRow) mergedPhone = snapPhNorm || (jidPlausible ? jidPhNorm : '');
                    else if (drawerFinalized) mergedPhone = matchedPhNorm || (drawerFinalized ? '' : snapPhNorm || '');
                    else if (rowDisagreesWithJid) {
                        mergedPhone =
                            snapPhNorm && snapPhNorm === jidPhNorm
                                ? snapPhNorm
                                : snapPhNorm || jidPhNorm || matchedPhNorm || '';
                    } else mergedPhone = matchedPhNorm || snapPhNorm || '';
                    /** JID 纠偏：旧行上的「抽屉收束」对错误号码无效，避免弱来源锁死 */
                    const jidReconciled = Boolean(!isGr && !chatSwappedOntoRow && !drawerFinalized && rowDisagreesWithJid && mergedPhone && jidPlausible && normalizePhone(mergedPhone) === jidPhNorm);
                    const profOk = isGr ? false : !chatSwappedOntoRow && Boolean(matched.profileCollected) && !jidReconciled;
                    const pendingNext = !isGr
                        ? chatSwappedOntoRow || jidReconciled
                            ? true
                            : typeof matched.pendingCollect === 'boolean'
                              ? matched.pendingCollect
                              : true
                        : false;
                    const profileSourceNext = chatSwappedOntoRow || jidReconciled ? null : matched.profileSource || null;
                    patchInboxRecord(matched.id, {
                        seatId,
                        chatId,
                        name: title || matched.name,
                        sourceChat: title || matched.sourceChat,
                        phone: mergedPhone,
                        isGroup: isGr,
                        accountType: isGr ? 'group' : (matched.accountType === 'business' ? 'business' : 'personal'),
                        profileCollected: profOk,
                        profileSource: profileSourceNext,
                        pendingCollect: pendingNext,
                        synced: true,
                        ...(String(snapshot.lastListPreview || '').trim()
                            ? { lastMessage: String(snapshot.lastListPreview || '').trim().slice(0, 520) }
                            : {}),
                        ...(snapAvatar ? { avatar: snapAvatar } : {}),
                    });
                    return normalizeInboxRecord({
                        ...matched,
                        seatId,
                        chatId,
                        name: title || matched.name,
                        sourceChat: title || matched.sourceChat,
                        phone: mergedPhone,
                        isGroup: isGr,
                        accountType: isGr ? 'group' : (matched.accountType === 'business' ? 'business' : 'personal'),
                        profileCollected: profOk,
                        profileSource: profileSourceNext,
                        pendingCollect: pendingNext,
                        ...(String(snapshot.lastListPreview || '').trim()
                            ? { lastMessage: String(snapshot.lastListPreview || '').trim().slice(0, 520) }
                            : {}),
                        ...(snapAvatar ? { avatar: snapAvatar } : {}),
                    });
                }
                const created = normalizeInboxRecord({
                    id: `wa-${seatId}-${chatId || phone || title}-${Date.now()}`,
                    chatId,
                    seatId,
                    name: title || phone || '未知联系人',
                    sourceChat: title || phone || '未知联系人',
                    phone,
                    isGroup: isGr,
                    accountType: isGr ? 'group' : 'personal',
                    ...(snapAvatar ? { avatar: snapAvatar } : {}),
                    unread: false,
                    unreadCount: 0,
                    replied: false,
                    collected: Boolean(phone) || isGr,

                    profileSource: null,
                    pendingCollect: !isGr,
                    synced: true,
                    timestamp: Date.now(),
                });
                saveGlobalInbox((prev) => [...prev, created]);
                return created;
            };

            /** 从 🌐 汇聚点开：按 chatId -> phone -> 显示名跳转；每次点击用 token 防旧异步串号 */
            const openContactRecord = (record) => {

                const clickToken = ++leftClickJumpTokenRef.current;
                const sid = String(item.seatId || seatLayoutRef.current.activeSeatId || '1');
                const itemChatId = normalizeWaChatKey(item.chatId || '');
                const cachedPhone = itemChatId ? peekCachedPhoneForChatKey(itemChatId) : '';
                const phone = normalizePhone(item.phone || cachedPhone || phoneFromWaChatKey(itemChatId) || '');
                const displayName = String(item.sourceChat || item.name || '').trim();
                const isGroup = Boolean(item.isGroup || isWaGroupChatKey(itemChatId));
                const itemKey = `${sid}:${itemChatId || phone || displayName || item.id}`;
                const isCurrentToken = () => leftClickJumpTokenRef.current === clickToken;

                const failJump = (reason) => {
                    if (!isCurrentToken()) return;
                    setPendingJump({ active: false, itemKey, reason: String(reason || 'open-failed') });

                };

                setPendingJump({ active: true, itemKey, reason: '' });

                setCurrentContactId(item.id);

                patchInboxRecord(item.id, {
                    unread: false,
                    unreadCount: 0,
                    synced: true,
                    ...(itemChatId ? { chatId: itemChatId } : {}),
                    ...(phone && !isGroup ? { phone } : {}),

                closeWaDrawerAnimated();

                    failJump('seat-not-found');
                    return;
                }
                if (!itemChatId && !phone && !displayName) {

                    return;
                }

                setActiveSeat(sid);

                setTimeout(async () => {
                    /** 跳转 token 失效＝用户已点开其它会话：必须结束本条「采集中」，否则会无限显示采集中 */
                    const clearCollectIfStale = () => {
                        if (isCurrentToken()) return false;

                        return true;
                    };
                    try {
                        if (clearCollectIfStale()) return;
                        const el = getWebviewForSeat(sid);
                        if (!el || typeof el.executeJavaScript !== 'function') {
                            failJump('seat-webview-not-ready');
                            return;
                        }
                        const ready = await waitForWebviewReady(el, 3600);
                        if (clearCollectIfStale()) return;
                        if (!ready) {
                            failJump('seat-webview-timeout');
                            return;
                        }

                        const opened = await safeWebviewExecute(
                            el,
                            buildWaOpenChatByStableTargetScript({
                                chatId: itemChatId,
                                phone,
                                displayName,
                                isGroup,
                            }),
                            true,
                            1600,
                            9000,
                        );
                        if (clearCollectIfStale()) return;
                        if (!opened?.ok) {
                            failJump(opened?.reason || 'open-target-failed');
                            return;
                        }

                        await new Promise((r) => setTimeout(r, 520));
                        if (clearCollectIfStale()) return;
                        waActiveChatKeyRef.current = '';
                        await syncActiveChatFromSnapshot().catch(() => {});
                        if (clearCollectIfStale()) return;

                        const snap = await safeWebviewExecute(el, WA_ACTIVE_CHAT_SNAPSHOT_SCRIPT, true, 900, 2200);
                        if (clearCollectIfStale()) return;
                        const openedChatId = normalizeWaChatKey(snap?.chatKey || itemChatId || '');
                        const openedPhone = normalizePhone(snap?.phone || phoneFromWaChatKey(openedChatId) || phone || '');
                        const openedIsGroup = Boolean(snap?.isGroup || isWaGroupChatKey(openedChatId) || isGroup);

                        if (openedChatId || openedPhone) {
                            patchInboxRecord(item.id, {
                                seatId: sid,
                                chatId: openedChatId || itemChatId,
                                phone: openedIsGroup ? '' : openedPhone,
                                isGroup: openedIsGroup,
                                accountType: openedIsGroup ? 'group' : (item.accountType === 'business' ? 'business' : 'personal'),
                                collected: true,
                                synced: true,
                                profileCollected: false,
                                profileSource: null,
                                pendingCollect: !openedIsGroup,
                            });

                    saveGlobalInbox((prev) => mergeInboxRecords(prev, items));

                    if (isActiveSeat) deferIfHeaderTransToolbarSelectActive(`sync:${sid}`, () => syncActiveChatFromSnapshot().catch(() => {}));

                const capPid = e.pointerId;

                let latestPos = start.pos;

                    moved: false,

                    dragActive: true,
                    liveX: start.pos.x,
                    liveY: start.pos.y,

                        btn.style.left = `${pos.x}px`;
                        btn.style.top = `${pos.y}px`;
                    }
                };
                paint(latestPos);
                const onMove = (ev) => {
                    const dx = ev.clientX - start.x;
                    const dy = ev.clientY - start.y;
                    if (Math.abs(dx) + Math.abs(dy) > 4) translateFabDragRef.current.moved = true;
                    latestPos = clampTranslateFabPos({ x: start.pos.x + dx, y: start.pos.y + dy });
                    translateFabDragRef.current.liveX = latestPos.x;
                    translateFabDragRef.current.liveY = latestPos.y;
                    paint(latestPos);
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    try {
                        capEl.releasePointerCapture(capPid);

                    document.body.style.userSelect = '';
                    translateFabDragRef.current.dragActive = false;
                    const btn = translateFabButtonRef.current;
                    if (btn) {
                        btn.style.left = '';
                        btn.style.top = '';
                    }
                    const next = clampTranslateFabPos(latestPos);
                    persistTranslateFabPos(next);
                    if (translateFabDragRef.current.moved) {
                        translateFabDragRef.current.justDraggedUntil = Date.now() + 380;
                    }
                };
                window.addEventListener('pointermove', onMove, { passive: true });
                window.addEventListener('pointerup', onUp);

                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function' || !payload) return;
