            const translateCurrentWhatsAppDraft = async () => {
                if (manualSendTranslateBusy) return;
                const sid = String(seatLayoutRef.current.activeSeatId || '');
                if (!sendTranslateEnabledForSeat(sid)) {
                    showSendTranslateBlockedToast('manual-translate-disabled');
                    return;
                }
                const el = getWebviewForSeat(sid);
                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') {
                    showSendTranslateBlockedToast('manual-translate-webview-not-ready');
                    return;
                }
                setManualSendTranslateBusy(true);
                try {
                    const runManualSendOnce = async () =>
                        safeWebviewExecute(
                            el,
                            `(() => {
                                if (typeof window.__fastgcManualTranslateAndSend !== 'function') {
                                    return { ok: false, handled: false, reason: 'manual-translate-not-installed' };
                                }
                                return window.__fastgcManualTranslateAndSend();
                            })()`,
                            true,
                            1600,
                            130000,
                        );

                    await safeWebviewExecute(el, buildWaSendAutoTranslateHookScript(true, sendSourceLang, sendTargetLang), true, 1600, 12000);
                    let result = await runManualSendOnce();
                    if (!result?.ok && String(result?.reason || '') === 'manual-translate-not-installed') {
                        // 自愈：偶发注入丢失时，重新注入并重试一次，避免用户手动二次点击。
                        await safeWebviewExecute(el, buildWaSendAutoTranslateHookScript(true, sendSourceLang, sendTargetLang), true, 2400, 15000);
                        result = await runManualSendOnce();
                    }
                    if (result && result.ok) {
                        if (result.sent) markCurrentReplied();
                        showSendTranslateBlockedToast(result.sent ? 'manual-translate-sent' : (result.unchanged ? (result.reason || 'manual-translate-same-text') : 'manual-translate-success'));
                    } else {
                        showSendTranslateBlockedToast(String(result?.reason || 'manual-translate-error'));
                    }
                } catch (_) {
                    showSendTranslateBlockedToast('manual-translate-error');
                } finally {
                    setManualSendTranslateBusy(false);
                }
            };

            const cleanupTranslateUi = async (seatId = seatLayoutRef.current.activeSeatId) => {
                const el = getWebviewForSeat(seatId);
                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return;
                try {
                    await safeWebviewExecute(el, buildWaTeardownLazyTranslateScript(), true);
                } catch (_) {}
                try {
                    await safeWebviewExecute(el, buildWaCleanupTranslateUiScript(), true);
                } catch (_) {}
            };

            /** ensure-install + rescan：优先复用已安装的 __fastgcMt，只触发 update/rescan；缺失时再注入完整脚本。 */
            const runIncomingTranslateOnce = async (seatId = seatLayoutRef.current.activeSeatId) => {
                if (!msgTranslateEnabledForSeat(seatId) || String(seatId) !== String(seatLayoutRef.current.activeSeatId)) return;
                const el = getWebviewForSeat(seatId);
                if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return;
                try {
                    const sl = JSON.stringify(msgSourceLang || 'auto');
                    const tl = JSON.stringify(msgTargetLang || 'zh-CN');
                    const reuse = await safeWebviewExecute(
                        el,
                        `(() => {
                            try {
                                if (window.__fastgcMt && window.__fastgcMt.installed && typeof window.__fastgcMt.update === 'function') {
                                    window.__fastgcMt.update({ sourceLang: ${sl}, targetLang: ${tl}, enabled: true });
                                    return { ok: true, reused: true };
                                }
                            } catch (_) {}
                            return { ok: false, reused: false };
                        })()`,
                        true,
                        1600,
                        6000,
                    );
                    if (!reuse || reuse.ok !== true) {
                        const script = buildWaInstallLazyTranslateScript(msgSourceLang, msgTargetLang, true);
                        await safeWebviewExecute(el, script, true, 1600, 6000);
                    }
                } catch (_) {}
            };

            /** chat-dirty / inbox-dirty 收敛为单个 350ms 重扫触发；懒翻译注入侧负责真正的“只翻可视区 + 滚动追加”。 */
            const scheduleChatDirtyTranslateFlush = (seatId = seatLayoutRef.current.activeSeatId) => {
                if (!msgTranslateEnabledForSeat(seatId)) return;
                if (chatDirtyTranslateTimerRef.current) clearTimeout(chatDirtyTranslateTimerRef.current);
                chatDirtyTranslateTimerRef.current = setTimeout(() => {
                    chatDirtyTranslateTimerRef.current = null;
                    if (!msgTranslateEnabledForSeat(seatId)) return;
                    runIncomingTranslateOnce(seatId);
                }, 350);
            };

            useEffect(() => {
                const colors = THEMES[currentTheme];
                const root = document.documentElement;
                Object.keys(colors).forEach(key => root.style.setProperty(`--${key.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}`, colors[key]));
            }, [currentTheme]);

            useEffect(() => {
                document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
                try {
                    document.title = translations[lang].docTitle || document.title;
                } catch (_) {}
            }, [lang]);

            useEffect(() => {
                scheduleWriteCachedInboxView({ currentContactId, inboxFilter, activeDrawer });
                return () => {
                    try {
                        flushWriteCachedInboxViewPending();
                    } catch (_) {}
                };
            }, [currentContactId, inboxFilter, activeDrawer]);

            useEffect(() => {
                currentContactIdRef.current = currentContactId;
            }, [currentContactId]);

            useEffect(() => {
                if (!globalInbox.length) {
                    if (currentContactId) setCurrentContactId('');
                    return;
                }
                if (currentContactId && globalInbox.some((item) => item.id === currentContactId)) return;
                setCurrentContactId(globalInbox[0].id);
            }, [globalInbox, currentContactId]);

            useEffect(() => {
                try {
                    localStorage.setItem('fastgc_send_translate_enabled', sendTranslateEnabled ? '1' : '0');
                    localStorage.setItem('fastgc_send_translate_source', sendSourceLang);
                    localStorage.setItem('fastgc_send_translate_target', sendTargetLang);
                    localStorage.setItem('fastgc_fixed_seat_translate_enabled', fixedSeatTranslateEnabled ? '1' : '0');
                } catch (_) {}
                fixedSeatTranslateEnabledRef.current = fixedSeatTranslateEnabled;
                const sendTimers = allMountedSeatIds.map((sid, idx) => {
                    return window.setTimeout(() => {
                        const el = getWebviewForSeat(sid);
                        if (isWebviewReady(el) && typeof el.executeJavaScript === 'function') {
                            const enabled = Boolean(sendTranslateEnabled && (!isSeatPinned(sid) || fixedSeatTranslateEnabled));
                            safeWebviewExecute(el, buildWaSendAutoTranslateHookScript(enabled, sendSourceLang, sendTargetLang), true);
                        }
                    }, idx * WA_MULTI_SEAT_SCRIPT_STAGGER_MS);
                });
                return () => sendTimers.forEach(timer => clearTimeout(timer));
            }, [sendTranslateEnabled, sendSourceLang, sendTargetLang, fixedSeatTranslateEnabled, allMountedSeatIds]);

            useEffect(() => {
                try {
                    localStorage.setItem('fastgc_msg_translate_enabled', msgTranslateEnabled ? '1' : '0');
                    localStorage.setItem('fastgc_msg_translate_source', msgSourceLang);
                    localStorage.setItem('fastgc_msg_translate_target', msgTargetLang);
                    localStorage.setItem('fastgc_fixed_seat_translate_enabled', fixedSeatTranslateEnabled ? '1' : '0');
                } catch (_) {}
                msgTranslateEnabledRef.current = msgTranslateEnabled;
                fixedSeatTranslateEnabledRef.current = fixedSeatTranslateEnabled;
                /** 同步到每个挂载席位：开启/换语言 → 注入懒翻译 (idempotent，已装则 update + rescan)；关闭 → teardown + 清理。 */
                const receiveTimers = allMountedSeatIds.map((sid, idx) => {
                    return window.setTimeout(() => {
                        if (!msgTranslateEnabledForSeat(sid) || String(sid) !== String(seatLayout.activeSeatId)) {
                            cleanupTranslateUi(sid);
                        } else if (msgTranslateEnabledForSeat(sid)) {
                            runIncomingTranslateOnce(sid);
                        }
                    }, idx * WA_MULTI_SEAT_SCRIPT_STAGGER_MS);
                });
                return () => receiveTimers.forEach(timer => clearTimeout(timer));
            }, [msgTranslateEnabled, msgSourceLang, msgTargetLang, fixedSeatTranslateEnabled, allMountedSeatIds, seatLayout.activeSeatId]);

            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const bridge = window.fastgcBridge;
                        if (!bridge?.getUiLocale || !bridge?.setUiLocale) return;
                        const prev = await bridge.getUiLocale();
                        if (cancelled) return;
                        await bridge.setUiLocale(lang);
                        try {
                            localStorage.setItem(UI_LANG_KEY, lang);
                        } catch (_) {}
                        if (cancelled) return;
                        if (prev !== lang) {
                            langRefreshAllSeatsRef.current = true;
                            try {
                                const url = waUrlByLang(lang);
                                const entries = Object.entries(webviewRefsBySeatRef.current || {});
                                entries.forEach(([sid, wv], idx) => {
                                    window.setTimeout(() => {
                                        safeWebviewLoadURL(wv, url);
                                    }, idx * WA_MULTI_SEAT_SCRIPT_STAGGER_MS);
                                });
                            } finally {
                                langRefreshAllSeatsRef.current = false;
                            }
                        }
                    } catch (_) {}
                })();
                return () => {
                    cancelled = true;
                };
            }, [lang]);

            useEffect(() => {
                const close = () => setContextMenu(null);
                window.addEventListener('click', close);
                return () => window.removeEventListener('click', close);
            }, []);
            useEffect(() => {
                const close = () => setShowTranslateSettings(false);
                window.addEventListener('click', close);
                return () => window.removeEventListener('click', close);
            }, []);

            useLayoutEffect(() => {
                if (!showTranslateSettings) return;
                const el = translateSettingsBtnRef.current;
                if (!el || typeof el.getBoundingClientRect !== 'function') return;
                const r = el.getBoundingClientRect();
                const w = Math.min(520, Math.max(320, window.innerWidth - 24));
                const x = Math.max(12, Math.min(window.innerWidth - w - 12, r.right - w));
                const y = Math.min(window.innerHeight - 12, r.bottom + 10);
                setTranslateSettingsPos({ x, y, w });
            }, [showTranslateSettings]);

            useEffect(() => {
                isCurrentGroupRef.current = isCurrentGroup;
                msgTranslateEnabledRef.current = msgTranslateEnabled;
                fixedSeatTranslateEnabledRef.current = fixedSeatTranslateEnabled;
            }, [isCurrentGroup, msgTranslateEnabled, fixedSeatTranslateEnabled]);

            useEffect(() => {
                return () => {
                    if (chatDirtyTranslateTimerRef.current) {
                        clearTimeout(chatDirtyTranslateTimerRef.current);
                        chatDirtyTranslateTimerRef.current = null;
                    }
                    if (chatDirtyTranslateBackupTimerRef.current) {
                        clearTimeout(chatDirtyTranslateBackupTimerRef.current);
                        chatDirtyTranslateBackupTimerRef.current = null;
                    }
                    if (incomingTranslatePostBusyRetryTimerRef.current) {
                        clearTimeout(incomingTranslatePostBusyRetryTimerRef.current);
                        incomingTranslatePostBusyRetryTimerRef.current = null;
                    }
                };
            }, []);

            useEffect(() => () => {
                if (sendTranslateToastTimerRef.current) {
                    clearTimeout(sendTranslateToastTimerRef.current);
                    sendTranslateToastTimerRef.current = null;
                }
            }, []);

            useEffect(() => {
                let timer = null;
                let stopped = false;
                const groupDetectPeriodMs = () =>
                    typeof document !== 'undefined' && document.visibilityState === 'hidden' ? 15000 : 5000;
                const applyGroupDetectPayload = (result) => {
                    if (!result || result.skipped === 'compose-busy') return;
                    const key = String(result.chatKey || '');
                    const nextIsGroup = Boolean(result.isGroup);
                    setIsCurrentGroup(nextIsGroup);
                    isCurrentGroupRef.current = nextIsGroup;
                    const cid = currentContactIdRef.current;
                    if (key && cid) {
                        const prev = (globalInboxRef.current || []).find((x) => x.id === cid);
                        if (prev && Boolean(prev.isGroup) !== nextIsGroup) {
                            if (nextIsGroup) {
                                patchInboxRecord(cid, { isGroup: true, profileCollected: false, phone: '', collected: true, synced: true });
                            } else {
                                patchInboxRecord(cid, { isGroup: false });
                            }
                        }
                    }
                };
                const tick = async () => {
                    const el = getActiveWebview();
                    if (!isWebviewReady(el) || typeof el.executeJavaScript !== 'function') return;
                    try {
                        const result = await safeWebviewExecute(el, WA_GROUP_DETECT_SCRIPT, true);
                        if (stopped) return;
                        if (result?.skipped !== 'compose-busy' && groupDetectPostBusyRetryTimerRef.current) {
                            clearTimeout(groupDetectPostBusyRetryTimerRef.current);
                            groupDetectPostBusyRetryTimerRef.current = null;
                        }
                        applyGroupDetectPayload(result);
                        if (result?.skipped === 'compose-busy') {
                            if (groupDetectPostBusyRetryTimerRef.current) return;
                            groupDetectPostBusyRetryTimerRef.current = setTimeout(() => {
                                groupDetectPostBusyRetryTimerRef.current = null;
                                if (stopped) return;
                                const el2 = getActiveWebview();
                                if (!isWebviewReady(el2) || typeof el2.executeJavaScript !== 'function') return;
                                void safeWebviewExecute(el2, WA_GROUP_DETECT_SCRIPT, true).then((r) => {
                                    if (stopped) return;
                                    applyGroupDetectPayload(r);
                                });
                            }, 2200);
                        }
                    } catch (_) {}
                };
                const arm = () => {
                    if (timer) {
                        clearInterval(timer);
                        timer = null;
                    }
                    timer = setInterval(tick, groupDetectPeriodMs());
                };
                const onVis = () => {
                    if (typeof document !== 'undefined' && document.visibilityState === 'visible') tick();
                    arm();
                };
                tick();
                arm();
                if (typeof document !== 'undefined') {
                    document.addEventListener('visibilitychange', onVis);
                }
                return () => {
                    stopped = true;
                    if (groupDetectPostBusyRetryTimerRef.current) {
                        clearTimeout(groupDetectPostBusyRetryTimerRef.current);
                        groupDetectPostBusyRetryTimerRef.current = null;
                    }
                    if (typeof document !== 'undefined') {
                        document.removeEventListener('visibilitychange', onVis);
                    }
                    if (timer) clearInterval(timer);
                };
            }, [seatLayout.activeSeatId]);

            /** 新消息与聊天切换改为事件驱动：由 webview MutationObserver 回传触发采集 */

            useEffect(() => {
                const activeSeat = String(seatLayout.activeSeatId || '');
                if (!msgTranslateEnabledForSeat(activeSeat)) {
                    cleanupTranslateUi(activeSeat);
                    return undefined;
                }
                /** 一次性 ensure-install + rescan；后续翻译完全由 webview 内的 IntersectionObserver/MutationObserver 懒加载驱动。 */
                runIncomingTranslateOnce(activeSeat);
                const onVis = () => {
                    if (typeof document !== 'undefined' && document.visibilityState === 'visible') {
                        runIncomingTranslateOnce(activeSeat);
                    }
                };
                if (typeof document !== 'undefined') {
                    document.addEventListener('visibilitychange', onVis);
                }
                return () => {
                    if (typeof document !== 'undefined') {
                        document.removeEventListener('visibilitychange', onVis);
                    }
                };
            }, [msgTranslateEnabled, msgSourceLang, msgTargetLang, fixedSeatTranslateEnabled, seatLayout.activeSeatId]);

            inboxListActionsRef.current = {
                openContactRecord,
                removeInboxRecord,
                patchInboxRecord,
                openInboxContextMenu,
            };

            /** 顶栏翻译区：单行 5 格 × 两行，同一 grid 保证列宽一致、上下左右对齐 */
            const transBarSel =
                'soft-select w-full min-w-0 h-7 bg-white border border-slate-200 rounded-md px-2 py-0 text-[10px] text-slate-700 font-bold truncate outline-none cursor-pointer disabled:cursor-default disabled:bg-white disabled:text-slate-700 disabled:opacity-95';
            const TransToolbarField = ({ label, children }) => (
                <div className="min-w-0 w-full flex items-center gap-1.5 h-7">
                    <span className="text-[10px] text-slate-500 whitespace-nowrap shrink-0 w-[4.25rem] text-right leading-tight">{label}</span>
                    <div className="min-w-0 flex-1 flex items-center min-h-0">{children}</div>
                </div>
            );
            const TransToolbarSelectDisplay = ({ label, value }) => (
                <TransToolbarField label={label}>
                    <select disabled tabIndex={-1} className={transBarSel} value={value}>
                        <option value={value}>{value}</option>
                    </select>
                </TransToolbarField>
            );
            const readSelectValue = (e) => {
                try {
                    const v = e && e.currentTarget ? e.currentTarget.value : e && e.target ? e.target.value : '';
                    return String(v == null ? '' : v);
                } catch (_) {
                    return '';
                }
            };

            const TranslateSettingsPanel = () => {
                if (!showTranslateSettings) return null;
                const OptBtn = ({ active, children, onClick, title }) => (
                    <button
                        type="button"
                        title={title || ''}
                        onClick={(e) => {
                            e.stopPropagation();
                            if (typeof onClick === 'function') onClick();
                        }}
                        className={`px-3 py-1.5 rounded-full text-[11px] font-extrabold transition-all border ${
                            active ? 'theme-active-tab border-transparent shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                        }`}
                    >
                        {children}
                    </button>
                );
                const Row = ({ label, children }) => (
                    <div className="flex items-start gap-3 py-2">
                        <div className="w-[90px] text-[11px] font-extrabold text-slate-600 pt-1 shrink-0">{label}</div>
                        <div className="flex-1 min-w-0 flex flex-wrap gap-2">{children}</div>
                    </div>
                );
                const body = (
                    <div
                        className="fixed z-[300] rounded-2xl border border-slate-200 bg-white shadow-[0_18px_60px_rgba(0,0,0,0.18)] p-4"
                        style={{ left: translateSettingsPos.x, top: translateSettingsPos.y, width: translateSettingsPos.w }}
                        onClick={(e) => e.stopPropagation()}
                        role="dialog"
                        aria-label={lang === 'zh' ? '翻译设置' : 'Translation settings'}
                    >
                        <div className="flex items-center justify-between gap-3 mb-2">
                            <div className="flex items-center gap-2 min-w-0">
                                <SVG.Globe c="w-4 h-4 text-slate-600" />
                                <div className="text-[12px] font-extrabold text-slate-800 truncate">{lang === 'zh' ? '翻译设置' : 'Translation'}</div>
                            </div>
                            <button
                                type="button"
                                className="w-8 h-8 rounded-full border border-slate-200 bg-white text-slate-500 hover:bg-slate-50 font-extrabold"
                                onClick={() => setShowTranslateSettings(false)}
                                aria-label={lang === 'zh' ? '关闭' : 'Close'}
                            >
                                ×
                            </button>
                        </div>

                        <div className="border-t border-slate-100 pt-2">
                            <Row label={t('hdrPlatform')}>
                                <span className="px-3 py-1.5 rounded-full text-[11px] font-extrabold border border-slate-200 bg-slate-50 text-slate-700">
                                    {t('hdrGoogle')}
                                </span>
                                <span className="text-[10px] font-bold text-slate-400 pt-1">
                                    {lang === 'zh' ? '当前仅支持谷歌翻译' : 'Currently Google only'}
                                </span>
                            </Row>
                            <Row label={t('hdrSendTrans')}>
                                <OptBtn active={sendTranslateEnabled} onClick={() => setSendTranslateEnabled(true)}>{t('hdrSendTransOn')}</OptBtn>
                                <OptBtn active={!sendTranslateEnabled} onClick={() => setSendTranslateEnabled(false)}>{lang === 'zh' ? '关闭翻译' : 'Off'}</OptBtn>
                            </Row>
                            <Row label={t('hdrYourLang')}>
                                {['auto', 'zh-CN', 'en', 'ms', 'th'].map((v) => (
                                    <OptBtn key={v} active={sendSourceLang === v} onClick={() => setSendSourceLang(v)}>
                                        {v === 'auto' ? t('hdrAutoDetect') : v === 'zh-CN' ? '中文' : v === 'en' ? 'English' : v === 'ms' ? 'Bahasa Melayu' : 'Thai'}
                                    </OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrTransTarget')}>
                                {['en', 'zh-CN', 'ms', 'th'].map((v) => (
                                    <OptBtn key={v} active={sendTargetLang === v} onClick={() => setSendTargetLang(v)}>
                                        {v === 'zh-CN' ? '中文 (简体)' : v === 'en' ? 'English' : v === 'ms' ? 'Bahasa Melayu' : 'Thai'}
                                    </OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrFont')}>
                                {[
                                    ['sm', t('hdrFontSmall')],
                                    ['md', t('hdrFontMedium')],
                                    ['lg', t('hdrFontLarge')],
                                ].map(([v, label]) => (
                                    <OptBtn key={v} active={uiFontSize === v} onClick={() => setUiFontSize(v)}>{label}</OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrFontColor')}>
                                {[
                                    ['green', t('hdrColorGreen')],
                                    ['blue', t('hdrColorBlue')],
                                    ['purple', t('hdrColorPurple')],
                                    ['orange', t('hdrColorOrange')],
                                ].map(([v, label]) => (
                                    <OptBtn key={v} active={uiTransFontColor === v} onClick={() => setUiTransFontColor(v)}>{label}</OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrMsgTrans')}>
                                <OptBtn active={msgTranslateEnabled} onClick={() => setMsgTranslateEnabled(true)}>{t('hdrMsgTransOn')}</OptBtn>
                                <OptBtn active={!msgTranslateEnabled} onClick={() => setMsgTranslateEnabled(false)}>{lang === 'zh' ? '关闭翻译' : 'Off'}</OptBtn>
                            </Row>
                            <Row label={t('hdrMsgLang')}>
                                {['auto', 'en', 'zh-CN', 'ms', 'th'].map((v) => (
                                    <OptBtn key={v} active={msgSourceLang === v} onClick={() => setMsgSourceLang(v)}>
                                        {v === 'auto' ? t('hdrAutoDetect') : v === 'zh-CN' ? '中文' : v === 'en' ? 'English' : v === 'ms' ? 'Bahasa Melayu' : 'Thai'}
                                    </OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrTransTarget')}>
                                {['zh-CN', 'en', 'ms', 'th'].map((v) => (
                                    <OptBtn key={v} active={msgTargetLang === v} onClick={() => setMsgTargetLang(v)}>
                                        {v === 'zh-CN' ? '中文 (简体)' : v === 'en' ? 'English' : v === 'ms' ? 'Bahasa Melayu' : 'Thai'}
                                    </OptBtn>
                                ))}
                            </Row>
                            <Row label={t('hdrFixedSeatTrans')}>
                                <OptBtn active={fixedSeatTranslateEnabled} onClick={() => setFixedSeatTranslateEnabled(true)}>{t('hdrFixedSeatTransOn')}</OptBtn>
                                <OptBtn active={!fixedSeatTranslateEnabled} onClick={() => setFixedSeatTranslateEnabled(false)}>{t('hdrFixedSeatTransOff')}</OptBtn>
                            </Row>
                        </div>
                    </div>
                );
                return ReactDOM.createPortal(body, document.body);
            };

            return (
                <LanguageContext.Provider value={{ lang, setLang, t }}>
                    <div className="h-full w-full flex flex-col theme-app-bg overflow-hidden relative">
                        <div className="border-b border-slate-200 flex items-center justify-between px-3 py-2 gap-2 shrink-0 bg-white z-50 flex-nowrap min-h-[52px]">
                            <div className="flex items-center gap-3 w-full xl:w-[260px] shrink-0 min-w-0">
                                <div className="w-8 h-8 theme-primary-btn rounded-xl flex items-center justify-center font-bold text-lg shadow-lg">F</div>
                                <div className="leading-tight"><div className="font-bold text-slate-800 text-[15px]">{t('appBrand')}</div><div className="text-[9px] text-slate-400 font-medium">{t('appSubtitle')}</div></div>
                                <div className="ml-2 flex gap-1 bg-slate-50 p-1 rounded-full border shadow-inner">
                                    {Object.keys(THEMES).map(n => (<button key={n} onClick={() => setCurrentTheme(n)} className={`w-3 h-3 rounded-full transition-all ${currentTheme===n?'ring-1 ring-slate-400 scale-110 shadow-sm':'opacity-50'}`} style={{backgroundColor:THEMES[n].primary}} />))}
                                </div>
                            </div>
                            <div className="order-3 xl:order-none w-full xl:flex-1" />
                            <div className="w-auto flex items-center gap-2 shrink-0 justify-end whitespace-nowrap">
                                <button type="button" onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')} title={lang === 'zh' ? 'English' : '中文'} className="w-10 h-10 flex items-center justify-center bg-white border border-slate-100 rounded-full text-[11px] font-extrabold shadow-sm">{lang === 'zh' ? t('langBtnToEn') : t('langBtnToZh')}</button>
                                <button
                                    ref={translateSettingsBtnRef}
                                    type="button"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        setShowTranslateSettings((v) => !v);
                                    }}
                                    className="flex items-center gap-1.5 bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 px-4 py-2 rounded-full text-[11px] font-bold shadow-sm transition-all cursor-pointer"
                                >
                                    <SVG.Globe c="w-4 h-4" /> {lang === 'zh' ? '翻译设置' : 'Translate'}
                                </button>
                                <button type="button" onClick={() => setShowSeatSetupModal(true)} className="flex items-center gap-1.5 bg-blue-50 text-blue-600 border border-blue-100 hover:bg-blue-100 px-4 py-2 rounded-full text-[11px] font-bold shadow-sm transition-all cursor-pointer"><SVG.Settings c="w-4 h-4" /> {t('seatSetup')}</button>
                                <button type="button" onClick={() => setShowAdminConfigModal(true)} className="bg-[#1e293b] text-white px-5 py-2.5 rounded-full text-[11px] font-bold shadow-lg hover:bg-black transition-all cursor-pointer">{t('adminConfig')}</button>
                            </div>
                        </div>
                        <TranslateSettingsPanel />

                        <div className="flex-1 flex overflow-hidden relative min-h-0">
                            <div className="w-[64px] theme-sidebar-bg border-r border-slate-200 flex flex-col items-center py-5 gap-6 shrink-0 z-40 shadow-[2px_0_10px_rgba(0,0,0,0.03)] transition-all">
                                <button onClick={() => activeDrawer === 'inbox' ? closeWaDrawerAnimated() : (setWaDrawerClosing(false), setActiveDrawer('inbox'))} className={`p-2.5 rounded-2xl transition-all relative ${activeDrawer==='inbox'?'theme-active-tab shadow-lg':'text-slate-400 hover:bg-white'}`}><SVG.Inbox c="w-6 h-6"/>{unreadConversationTotal > 0 && <span className="absolute -top-1 -right-1 min-w-4 h-4 px-1 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center border-2 border-white shadow-sm">{formatUnreadBadge(unreadConversationTotal)}</span>}</button>
                                <button onClick={() => activeDrawer === 'content' ? closeWaDrawerAnimated() : (setWaDrawerClosing(false), setActiveDrawer('content'))} className={`p-2.5 rounded-2xl transition-all ${activeDrawer==='content'?'theme-active-tab shadow-lg':'text-slate-400 hover:bg-white'}`}><SVG.Database c="w-6 h-6"/></button>
                                <button onClick={() => activeDrawer === 'phone' ? closeWaDrawerAnimated() : (setWaDrawerClosing(false), setActiveDrawer('phone'))} className={`p-2.5 rounded-2xl transition-all ${activeDrawer==='phone'?'theme-active-tab shadow-lg':'text-slate-400 hover:bg-white'}`}><SVG.UserPlus c="w-6 h-6"/></button>

                                <div className="mt-auto flex flex-col gap-4 items-center">
                                    <div className="flex flex-col gap-1.5 items-center w-full max-w-[52px]">
                                        <div
                                            className="h-1.5 shrink-0 w-6 rounded-sm bg-transparent"
                                            aria-hidden
                                            onDragOver={(e) => handleCustomLinkDragOver(e, 0)}
                                            onDrop={(e) => handleCustomLinkDrop(e, 0)}
                                        />
                                        {customLinks.map((l, i) => (
                                            <div
                                                key={l.id}
                                                onDragOver={(e) => handleCustomLinkDragOver(e, i)}
                                                onDrop={(e) => handleCustomLinkDrop(e, i)}
                                                className={`flex flex-col items-center gap-0.5 rounded-xl transition-opacity ${
                                                    dragOverCustomLinkIdx === i ? 'ring-2 ring-blue-400 rounded-xl' : ''
                                                } ${draggedCustomLinkIdx === i ? 'opacity-50' : ''}`}
                                            >
                                                <span
                                                    draggable
                                                    onDragStart={(e) => handleCustomLinkDragStart(e, i)}
                                                    onDragEnd={handleCustomLinkDragEnd}
                                                    onClick={(e) => e.stopPropagation()}
                                                    className="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500 shrink-0 p-0.5 select-none touch-none"
                                                    title={t('linkDragReorderHint')}
                                                >
                                                    <SVG.GripVertical c="w-3 h-3" />
                                                </span>
                                                <button
                                                    type="button"
                                                    title={l.name}
                                                    onClick={() => window.open(l.url, '_blank', 'noopener,noreferrer')}
                                                    className="p-2.5 rounded-2xl text-slate-400 hover:theme-primary-text hover:bg-blue-50 bg-white shadow-sm flex items-center justify-center"
                                                >
                                                    <span className="w-[26px] h-[26px] rounded-xl bg-blue-50 text-blue-600 text-[14px] font-extrabold flex items-center justify-center leading-none">
                                                        {customLinkNameInitial(l.name)}
                                                    </span>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="w-8 border-t border-slate-200"></div>
                                    <button onClick={()=>setShowLinkManager(true)} className="p-2.5 rounded-2xl text-slate-300 hover:text-blue-500 border border-dashed border-slate-200"><SVG.Plus c="w-5 h-5"/></button>
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col relative bg-white overflow-hidden min-w-0 min-h-0">
                                <SeatWorkspaceBar
                                    layout={seatLayout}
                                    onReorderFree={onReorderFreeSeats}
                                    setActiveSeat={setActiveSeat}
                                    onReloadSeatWebview={reloadSeatWebviewById}
                                    scriptsPanelCollapsed={scriptsPanelCollapsed}
                                    onToggleScriptsPanel={toggleScriptsPanelCollapsed}
                                    t={t}
                                    seatUnreadMap={seatUnreadMapForPills}
                                />
                                <div className="flex-1 flex overflow-hidden min-h-0">
                                    <div className="flex-1 flex flex-col min-w-0 min-h-0 relative">
                                        <WhatsAppWebColumn
                                            activeSeatId={seatLayout.activeSeatId}
                                            seatIds={allMountedSeatIds}
                                            webviewRef={webviewRef}
                                            webviewRefsBySeatRef={webviewRefsBySeatRef}
                                            onWebviewReady={handleWebviewReady}
                                            onWebviewEvent={handleWebviewEvent}
                                            uiLang={lang}
                                        />
                                        {activeDrawer !== 'none' && (
                                            <>
                                            <button
                                                type="button"
                                                className="wa-chat-dismiss-area wa-chat-dismiss-area-left"
                                                aria-label={lang === 'zh' ? '关闭左侧抽屉并操作聊天区' : 'Close left drawer'}
                                                onClick={closeWaDrawerAnimated}
                                            />
                                            <div
                                                className={`absolute left-0 top-0 bottom-0 z-[45] flex flex-col min-w-0 bg-white border-r border-slate-200 shadow-[8px_0_32px_rgba(0,0,0,0.12)] pointer-events-auto wa-overlay-drawer ${waDrawerClosing ? 'wa-overlay-drawer-exit' : ''}`}
                                                onClick={(e) => e.stopPropagation()}
                                            >
                                                    {activeDrawer === 'inbox' && (
                                                        <div className="h-full flex flex-col relative min-h-0">
                                                            <div className="h-[46px] flex items-center justify-between gap-2 px-4 border-b bg-slate-50 font-bold text-slate-800 shrink-0">
                                                                <span className="shrink-0">{t('inboxGlobalTitle')}</span>
                                                                <div className="flex items-center gap-2 min-w-0">
                                                                    <div className="relative w-[150px] min-w-0">
                                                                        <input
                                                                            value={inboxPhoneSearch}
                                                                            onChange={(e) => setInboxPhoneSearch(e.target.value)}
                                                                            onKeyDown={(e) => {
                                                                                if (e.key === 'Enter' && inboxVisibleList.length === 1) {
                                                                                    openContactRecord(inboxVisibleList[0]);
                                                                                }
                                                                            }}
                                                                            placeholder={t('inboxPhoneSearchPh')}
                                                                            inputMode="tel"
                                                                            className="w-full h-7 rounded-full border border-slate-200 bg-white pl-3 pr-7 text-[11px] font-bold text-slate-700 outline-none focus:border-blue-300 focus:ring-2 focus:ring-blue-100 placeholder:text-slate-300"
                                                                        />
                                                                        {inboxPhoneSearch ? (
                                                                            <button
                                                                                type="button"
                                                                                aria-label="Clear phone search"
                                                                                onClick={() => setInboxPhoneSearch('')}
                                                                                className="absolute right-1.5 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full text-slate-300 hover:text-slate-600 hover:bg-slate-100 flex items-center justify-center"
                                                                            >
                                                                                ×
                                                                            </button>
                                                                        ) : null}
                                                                    </div>
                                                                    <button onClick={clearGlobalInbox} className="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-red-50 text-red-500 border border-red-100 hover:bg-red-100">{t('clearCache')}</button>
                                                                    <button type="button" onClick={closeWaDrawerAnimated}><SVG.XCircle c="w-5 h-5 text-gray-300" /></button>
                                                                </div>
                                                            </div>
                                                            <div className="px-3 py-2 bg-white border-b flex gap-1.5 shrink-0 flex-wrap">
                                                                {[
                                                                    ['all', t('all'), ''],
                                                                    ['unread', t('unread'), formatUnreadBadge(unreadConversationTotal)],
                                                                    ['unreplied', t('unreplied'), ''],
                                                                    ['follow', t('follow'), ''],
                                                                    ['group', t('inboxGroup'), ''],
                                                                    ['updates', t('inboxUpdates'), ''],
                                                                ].map(([key, label, badge]) => (
                                                                    <button key={key} type="button" onClick={() => setInboxFilter(key)} className={`px-3 py-1.5 rounded-full text-[11px] font-extrabold transition-all inline-flex items-center gap-1.5 ${inboxFilter === key ? 'theme-active-tab' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                                                        <span>{label}</span>
                                                                        {badge ? <span className={`min-w-[16px] h-[16px] px-1 rounded-full text-[9px] font-extrabold inline-flex items-center justify-center ${inboxFilter === key ? 'bg-white/20 text-white' : 'bg-red-500 text-white'}`}>{badge}</span> : null}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                            <div
                                                                ref={inboxScrollRef}
                                                                onScroll={onInboxListScroll}
                                                                className="flex-1 overflow-y-auto p-1.5 min-h-0"
                                                                style={{
                                                                    overscrollBehavior: 'contain',
                                                                    WebkitOverflowScrolling: 'touch',
                                                                    overflowY:
                                                                        inboxVisibleList.length > 0 &&
                                                                        inboxVirtualWindow.totalH <=
                                                                            Math.max(0, Number(inboxVirtualScrollStateRef.current?.clientHeight || 0)) + 24
                                                                            ? 'hidden'
                                                                            : 'auto',
                                                                }}
                                                            >
                                                                {inboxVisibleList.length === 0 && (
                                                                    <div className="h-full min-h-[120px] flex items-center justify-center text-center text-slate-300 text-[12px] font-bold px-8 leading-relaxed">
                                                                        {inboxSearchActive
                                                                            ? inboxPhoneSearchScanning
                                                                                ? t('inboxPhoneSearchScanning')
                                                                                : t('inboxPhoneSearchNoResult')
                                                                            : inboxFilter === 'group'
                                                                              ? t('inboxEmptyGroup')
                                                                              : inboxFilter === 'updates'
                                                                                ? t('inboxEmptyUpdates')
                                                                                : t('inboxEmptyHint')}
                                                                    </div>
                                                                )}
                                                                {inboxVisibleList.length > 0 && (
                                                                    <div style={{ minHeight: inboxVirtualWindow.totalH }} className="relative w-full">
                                                                        <div className="w-full" style={{ height: inboxVirtualWindow.topPad }} aria-hidden />
                                                                        {inboxVirtualWindow.slice.map((c) => (
                                                                            <div
                                                                                key={globalInboxRowReactKey(c)}
                                                                                className="w-full shrink-0 overflow-hidden"
                                                                                style={{ height: FASTGC_INBOX_VIRTUAL_ROW_PX }}
                                                                            >
                                                                                <GlobalInboxListRow
                                                                                    c={c}
                                                                                    isActive={currentContactId === c.id}
                                                                                    lang={lang}
                                                                                    seatLayout={seatLayout}
                                                                                    inboxRowI18n={inboxRowI18n}
                                                                                    onRowActivate={onInboxRowActivate}
                                                                                    onRowContextMenu={onInboxRowContextMenu}
                                                                                    onRowTrash={onInboxRowTrash}
                                                                                    onRowFollowToggle={onInboxRowFollowToggle}
                                                                                />
                                                                            </div>
                                                                        ))}
                                                                        <div className="w-full" style={{ height: inboxVirtualWindow.botPad }} aria-hidden />
                                                                    </div>
                                                                )}
                                                            </div>
                                                            {contextMenu && (
                                                                <div className="fixed z-[120] context-menu bg-white rounded-xl overflow-hidden py-1 min-w-[130px]" style={{ left: contextMenu.x, top: contextMenu.y }} onClick={(e) => e.stopPropagation()}>
                                                                    {contextMenuRecord?.following ? (
                                                                        <button type="button" onClick={() => toggleFollowInboxRecord(contextMenu.id, false)} className="w-full text-left px-4 py-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">{t('unfollow')}</button>
                                                                    ) : (
                                                                        <button type="button" onClick={() => toggleFollowInboxRecord(contextMenu.id, true)} className="w-full text-left px-4 py-2.5 text-[12px] font-bold text-slate-700 hover:bg-slate-50">{t('followUp')}</button>
                                                                    )}
                                                                    <button type="button" onClick={() => removeInboxRecord(contextMenu.id)} className="w-full text-left px-4 py-2.5 text-[12px] font-bold text-red-500 hover:bg-red-50">{t('ctxClearUser')}</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                    {activeDrawer === 'content' && (
                                                        <ContentManagerDrawer
                                                            onCopy={copyToClipboard}
                                                            onSend={sendScriptToWhatsApp}
                                                            onClose={closeWaDrawerAnimated}
                                                        />
                                                    )}
                                                    {activeDrawer === 'phone' && (
                                                        <PhoneRewardsDrawer onClose={closeWaDrawerAnimated} prefillPhone={currentContact?.phone || ''} />
                                                    )}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                    <div
                                        role="separator"
                                        aria-orientation="vertical"
                                        aria-label={t('rightPanelResizeAria')}
                                        tabIndex={scriptsPanelCollapsed ? -1 : 0}
                                        className={`scripts-panel-resizer w-[6px] shrink-0 z-[11] bg-slate-100/85 border-l border-slate-200 min-h-0 outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:ring-inset ${
                                            scriptsPanelCollapsed ? 'hidden' : 'hidden xl:flex cursor-col-resize hover:bg-slate-200/90'
                                        }`}
                                        onPointerDown={onScriptsPanelResizePointerDown}
                                        onKeyDown={(e) => {
                                            if (scriptsPanelCollapsed) return;
                                            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
                                            e.preventDefault();
                                            const step = e.shiftKey ? 48 : 16;
                                            const delta = e.key === 'ArrowRight' ? -step : step;
                                            setScriptsPanelWidthPx((w0) => {
                                                const nw = Math.min(
                                                    SCRIPTS_PANEL_WIDTH_MAX,
                                                    Math.max(SCRIPTS_PANEL_WIDTH_MIN, w0 + delta),
                                                );
                                                scriptsPanelWidthRef.current = nw;
                                                try {
                                                    localStorage.setItem(SCRIPTS_PANEL_WIDTH_KEY, String(nw));
                                                } catch (_) {}
                                                return nw;
                                            });
                                        }}
                                    />
                                    <div
                                        ref={scriptsPanelShellRef}
                                        className={`scripts-panel-shell flex flex-col shrink-0 bg-white z-10 min-h-0 overflow-hidden transition-[width] duration-150 ease-out ${
                                            scriptsPanelCollapsed ? 'hidden' : 'hidden xl:flex'
                                        }`}
                                        style={scriptsPanelCollapsed ? undefined : { width: scriptsPanelWidthPx }}
                                    >
                                        <div role="tablist" aria-label={t('scriptTitle')} className="flex gap-1 p-2 border-b bg-[#f8f9fa] shrink-0">
                                            {['zh', 'en'].map((libraryId) => (
                                                <button
                                                    key={libraryId}
                                                    type="button"
                                                    role="tab"
                                                    id={`script-library-tab-${libraryId}`}
                                                    aria-selected={scriptLibraryActive === libraryId}
                                                    aria-controls={`script-library-${libraryId}`}
                                                    onClick={() => setScriptLibraryActive(libraryId)}
                                                    className={`flex-1 px-2 py-2 rounded-lg text-[12px] font-extrabold transition-colors ${scriptLibraryActive === libraryId ? 'theme-primary-btn shadow-sm' : 'text-slate-500 hover:bg-slate-200/70'}`}
                                                >{t(libraryId === 'zh' ? 'scriptLibraryZh' : 'scriptLibraryEn')}</button>
                                            ))}
                                        </div>
                                        <RightScriptLibrary onFill={copyToClipboard} onSend={sendScriptToWhatsApp} key={scriptLibraryActive} libraryId={scriptLibraryActive} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {typeof document !== 'undefined'
                            ? ReactDOM.createPortal(
                                  (() => {
                                      void translateFabLayoutTick;
                                      const p = getTranslateFabRenderPos();
                                      const disabled =
                                          !sendTranslateEnabledForSeat(seatLayout.activeSeatId) || manualSendTranslateBusy;
                                      return (
                                          <button
                                              ref={translateFabButtonRef}
                                              type="button"
                                              onPointerDown={handleTranslateFabPointerDown}
                                              onClick={(e) => {
                                                  e.preventDefault();
                                                  e.stopPropagation();
                                                  if (Date.now() < Number(translateFabDragRef.current.justDraggedUntil || 0)) return;
                                                  if (disabled) return;
                                                  translateCurrentWhatsAppDraft();
                                              }}
                                              aria-disabled={disabled ? 'true' : 'false'}
                                              className={`fixed h-9 px-3 rounded-lg text-[12px] font-extrabold shadow-lg border select-none touch-none pointer-events-auto ${
                                                  disabled
                                                      ? 'bg-slate-500 text-white cursor-grab active:cursor-grabbing opacity-95 border-amber-200/80 ring-1 ring-amber-300/50'
                                                      : 'bg-emerald-600 text-white hover:bg-emerald-700 cursor-grab active:cursor-grabbing border-white/40'
                                              }`}
                                              style={{ left: p.x, top: p.y, zIndex: 2147483647 }}
                                              title={
                                                  lang === 'zh'
                                                      ? '可拖至窗口任意位置，松手保存；点击翻译并发送（若被聊天区遮挡，请拖到空白处）。'
                                                      : 'Drag anywhere in the window; saved on release. Click to translate and send (if covered by chat, drag to a clear area).'
                                              }
                                          >
                                              {manualSendTranslateBusy
                                                  ? lang === 'zh'
                                                      ? '翻译中'
                                                      : 'Translating'
                                                  : lang === 'zh'
                                                    ? '翻译'
                                                    : 'Translate'}
                                          </button>
                                      );
                                  })(),
                                  document.body,
                              )
                            : null}

                        {sendTranslateToast.show && (
                            <div className="pointer-events-none fixed inset-x-0 bottom-[76px] z-[260] flex justify-center px-4">
                                <div
                                    className="pointer-events-auto max-w-lg rounded-2xl border border-amber-400/40 bg-[rgba(15,23,42,.94)] px-4 py-3 text-center shadow-xl"
                                    role="status"
                                >
                                    <div className="text-[12px] font-bold leading-snug text-amber-50">{sendTranslateToast.message}</div>
                                    <button
                                        type="button"
                                        className="mt-2 text-[10px] font-bold text-amber-200 hover:text-white underline-offset-2"
                                        onClick={() => {
                                            if (sendTranslateToastTimerRef.current) clearTimeout(sendTranslateToastTimerRef.current);
                                            sendTranslateToastTimerRef.current = null;
                                            setSendTranslateToast({ show: false, message: '' });
                                        }}
                                    >
                                        {lang === 'zh' ? '关闭' : 'Dismiss'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {showSeatSetupModal && (
                            <SeatSetupModal layout={seatLayout} onApplyLayout={applySeatLayout} onClose={() => setShowSeatSetupModal(false)} />
                        )}
                        {showAdminConfigModal && (
                            <AdminConfigModal

                                diagnosticsProps={{
                                    activeSeatId: String(seatLayout.activeSeatId || ''),
                                    onCleanupTranslateUiActiveSeat: () => cleanupTranslateUi(seatLayout.activeSeatId),
                                    onClearGlobalInboxCache: () => {
                                        try { localStorage.removeItem(GLOBAL_INBOX_KEY); } catch (_) {}
                                        try { localStorage.removeItem(GLOBAL_INBOX_VIEW_KEY); } catch (_) {}
                                        try { localStorage.removeItem(GLOBAL_INBOX_HIDDEN_MERGE_KEYS_KEY); } catch (_) {}
                                        try { localStorage.removeItem('fastgc_global_inbox_order'); } catch (_) {}
                                        try {
                                            setGlobalInbox([]);
                                            writeCachedInbox([]);
                                        } catch (_) {}
                                    },
                                    onClearWaPhoneCaches: () => {
                                        try { localStorage.removeItem(WA_PHONE_CHATKEY_CACHE_KEY); } catch (_) {}
                                        try { localStorage.removeItem(WA_PHONE_VERIFIED_AT_KEY); } catch (_) {}
                                        try { localStorage.removeItem(WA_DRAWER_PHONE_DONE_KEY); } catch (_) {}
                                        try { localStorage.removeItem(WA_DRAWER_TRUTH_MAP_KEY); } catch (_) {}
                                    },
                                }}
                                onClose={() => setShowAdminConfigModal(false)}
                                onOpenLinks={() => {
                                    setShowAdminConfigModal(false);
                                    setShowLinkManager(true);
                                }}
                            />
                        )}
                        {showLinkManager && <LinkManagerModal links={customLinks} setLinks={setCustomLinks} onClose={()=>setShowLinkManager(false)} />}
                    </div>
                </LanguageContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        window.performance.mark('fastgc-renderer-ready');
        root.render(<App />);
    </script>
</body>
</html>
